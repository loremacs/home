<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini3Flash: Prism Break</title>
    <style>
        :root {
            --bg-color: #050b16;
            --accent-color: #00f2ff;
            --text-color: #e0faff;
            --glass-bg: rgba(15, 25, 45, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at center, #0a192f 0%, #050b16 100%);
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 242, 255, 0.1);
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .hud span b {
            color: var(--accent-color);
        }

        .overlay {
            background: rgba(5, 11, 22, 0.85);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            border: 1px solid var(--glass-border);
            pointer-events: auto;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .overlay.hidden {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
        }

        p {
            font-size: 14px;
            margin-bottom: 30px;
            color: #8fa1b3;
            max-width: 300px;
            line-height: 1.6;
        }

        button {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 12px 30px;
            border-radius: 99px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 20px var(--accent-color);
        }

        .credits {
            position: absolute;
            bottom: 20px;
            font-size: 10px;
            color: #4b5d6d;
            letter-spacing: 1px;
        }

        #vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="vignette"></div>
    
    <div class="hud">
        <span>SCORE: <b id="scoreVal">0000</b></span>
        <span>LIVES: <b id="livesVal">3</b></span>
    </div>

    <div class="ui-layer">
        <div id="startOverlay" class="overlay">
            <h1>PRISM BREAK</h1>
            <p>Direct the beam. Shatter the spectrum. Created by Gemini3Flash.</p>
            <button id="startBtn">Initiate</button>
        </div>
        
        <div id="gameOverOverlay" class="overlay hidden">
            <h1 id="statusTitle">SPECTRUM COLLAPSED</h1>
            <p id="statusMsg">Signal lost. Re-synchronize?</p>
            <button id="restartBtn">Reconnect</button>
        </div>

        <div class="credits">PROJECT: GEMINI3FLASH // PROTOCOL: ARCADE-V1</div>
    </div>
</div>

<script>
    "use strict";

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const livesVal = document.getElementById('livesVal');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const statusTitle = document.getElementById('statusTitle');

    // Game Config
    const PADDLE_WIDTH = 120;
    const PADDLE_HEIGHT = 12;
    const BALL_RADIUS = 6;
    const BRICK_ROWS = 6;
    const BRICK_COLS = 10;
    const BRICK_PADDING = 10;
    const BRICK_OFFSET_TOP = 60;
    const BRICK_OFFSET_LEFT = 35;
    const BRICK_WIDTH = 70;
    const BRICK_HEIGHT = 20;

    let score = 0;
    let lives = 3;
    let gameActive = false;
    let animationId;

    const paddle = {
        x: canvas.width / 2 - PADDLE_WIDTH / 2,
        y: canvas.height - 40,
        width: PADDLE_WIDTH,
        height: PADDLE_HEIGHT,
        color: '#00f2ff'
    };

    const ball = {
        x: canvas.width / 2,
        y: canvas.height - 60,
        dx: 4,
        dy: -4,
        radius: BALL_RADIUS,
        color: '#fff'
    };

    let bricks = [];
    const colors = [
        '#ff0055', // Redish
        '#ff9900', // Orange
        '#ffee00', // Yellow
        '#00ff66', // Green
        '#0099ff', // Blue
        '#9900ff'  // Purple
    ];

    function initBricks() {
        bricks = [];
        for (let c = 0; c < BRICK_COLS; c++) {
            bricks[c] = [];
            for (let r = 0; r < BRICK_ROWS; r++) {
                bricks[c][r] = { x: 0, y: 0, status: 1, color: colors[r % colors.length] };
            }
        }
    }

    // Audio Setup (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type, duration) {
        if (audioCtx.state === 'suspended') return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // Particles
    let particles = [];
    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.size = Math.random() * 3 + 1;
            this.speedX = (Math.random() - 0.5) * 6;
            this.speedY = (Math.random() - 0.5) * 6;
            this.life = 1.0;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.02;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    function createExplosion(x, y, color) {
        for (let i = 0; i < 15; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    // Controls
    let rightPressed = false;
    let leftPressed = false;

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Right' || e.key === 'ArrowRight') rightPressed = true;
        if (e.key === 'Left' || e.key === 'ArrowLeft') leftPressed = true;
    });

    document.addEventListener('keyup', (e) => {
        if (e.key === 'Right' || e.key === 'ArrowRight') rightPressed = false;
        if (e.key === 'Left' || e.key === 'ArrowLeft') leftPressed = false;
    });

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const root = document.documentElement;
        const mouseX = e.clientX - rect.left - root.scrollLeft;
        paddle.x = mouseX - paddle.width / 2;
        if (paddle.x < 0) paddle.x = 0;
        if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
    });

    function collisionDetection() {
        for (let c = 0; c < BRICK_COLS; c++) {
            for (let r = 0; r < BRICK_ROWS; r++) {
                const b = bricks[c][r];
                if (b.status === 1) {
                    if (ball.x > b.x && ball.x < b.x + BRICK_WIDTH && ball.y > b.y && ball.y < b.y + BRICK_HEIGHT) {
                        ball.dy = -ball.dy;
                        b.status = 0;
                        score += 10;
                        scoreVal.textContent = score.toString().padStart(4, '0');
                        createExplosion(b.x + BRICK_WIDTH / 2, b.y + BRICK_HEIGHT / 2, b.color);
                        playSound(200 + (score % 400), 'sine', 0.1);
                        
                        if (score === BRICK_ROWS * BRICK_COLS * 10) {
                            victory();
                        }
                    }
                }
            }
        }
    }

    function drawBall() {
        // Outer glow
        ctx.shadowBlur = 15;
        ctx.shadowColor = paddle.color;
        
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = ball.color;
        ctx.fill();
        ctx.closePath();
        
        ctx.shadowBlur = 0;
    }

    function drawPaddle() {
        ctx.fillStyle = paddle.color;
        ctx.beginPath();
        ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 6);
        ctx.fill();
        
        // Paddle glow
        ctx.shadowBlur = 10;
        ctx.shadowColor = paddle.color;
        ctx.strokeRect(paddle.x, paddle.y, paddle.width, paddle.height);
        ctx.shadowBlur = 0;
    }

    function drawBricks() {
        for (let c = 0; c < BRICK_COLS; c++) {
            for (let r = 0; r < BRICK_ROWS; r++) {
                if (bricks[c][r].status === 1) {
                    const brickX = c * (BRICK_WIDTH + BRICK_PADDING) + BRICK_OFFSET_LEFT;
                    const brickY = r * (BRICK_HEIGHT + BRICK_PADDING) + BRICK_OFFSET_TOP;
                    bricks[c][r].x = brickX;
                    bricks[c][r].y = brickY;
                    
                    ctx.fillStyle = bricks[c][r].color;
                    ctx.beginPath();
                    ctx.roundRect(brickX, brickY, BRICK_WIDTH, BRICK_HEIGHT, 4);
                    ctx.fill();
                    
                    // Glass highlight
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.fillRect(brickX, brickY, BRICK_WIDTH, BRICK_HEIGHT/2);
                }
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        drawBricks();
        drawBall();
        drawPaddle();
        
        // Particles
        particles.forEach((p, index) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(index, 1);
        });

        collisionDetection();

        if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
            ball.dx = -ball.dx;
            playSound(150, 'square', 0.05);
        }
        if (ball.y + ball.dy < ball.radius) {
            ball.dy = -ball.dy;
            playSound(150, 'square', 0.05);
        } else if (ball.y + ball.dy > canvas.height - ball.radius - 20) {
            if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                // Determine bounce angle based on where it hit the paddle
                let hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                ball.dx = 8 * hitPoint;
                ball.dy = -ball.dy;
                playSound(300, 'triangle', 0.1);
            } else if (ball.y + ball.dy > canvas.height - ball.radius) {
                lives--;
                livesVal.textContent = lives;
                playSound(100, 'sawtooth', 0.3);
                if (!lives) {
                    gameOver();
                } else {
                    resetBall();
                }
            }
        }

        if (rightPressed && paddle.x < canvas.width - paddle.width) {
            paddle.x += 7;
        } else if (leftPressed && paddle.x > 0) {
            paddle.x -= 7;
        }

        ball.x += ball.dx;
        ball.y += ball.dy;

        if (gameActive) {
            animationId = requestAnimationFrame(draw);
        }
    }

    function resetBall() {
        ball.x = canvas.width / 2;
        ball.y = canvas.height - 60;
        ball.dx = 4;
        ball.dy = -4;
        paddle.x = (canvas.width - paddle.width) / 2;
    }

    function gameOver() {
        gameActive = false;
        statusTitle.textContent = "SPECTRUM COLLAPSED";
        gameOverOverlay.classList.remove('hidden');
    }

    function victory() {
        gameActive = false;
        statusTitle.textContent = "PRISM RESOLVED";
        gameOverOverlay.classList.remove('hidden');
    }

    function startGame() {
        score = 0;
        lives = 3;
        scoreVal.textContent = "0000";
        livesVal.textContent = lives;
        initBricks();
        resetBall();
        gameActive = true;
        startOverlay.classList.add('hidden');
        gameOverOverlay.classList.add('hidden');
        draw();
    }

    startBtn.addEventListener('click', () => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        startGame();
    });

    restartBtn.addEventListener('click', startGame);

    // Canvas RoundRect Polyfill
    if (!ctx.roundRect) {
        ctx.roundRect = function (x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.moveTo(x + r, y);
            this.arcTo(x + w, y, x + w, y + h, r);
            this.arcTo(x + w, y + h, x, y + h, r);
            this.arcTo(x, y + h, x, y, r);
            this.arcTo(x, y, x + w, y, r);
            this.closePath();
            return this;
        };
    }

</script>

</body>
</html>
