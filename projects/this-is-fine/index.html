<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThisIsFine — Layoffs & Jobs Tracker</title>
    <style>
        :root {
            --fire-orange: #ff4d00;
            --fire-yellow: #ffcc00;
            --fire-red: #cc0000;
            --bg-dark: #0d0400;
            --card-bg: rgba(28, 8, 0, 0.75);
            --glass-border: rgba(255, 100, 0, 0.18);
            --text-main: #fff5f0;
            --text-dim: #b3a099;
            --accent-blue: #5dd6ff;
            --jobs-green: #3ddc84;
            --jobs-green-dim: rgba(61, 220, 132, 0.18);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        a { color: inherit; text-decoration: none; }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: system-ui, -apple-system, 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===================== HEADER + FIRE ===================== */
        header {
            position: sticky;
            top: 0;
            z-index: 20;
            text-align: center;
            padding: 28px 20px 22px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(10, 3, 0, 0.92);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        #fire-canvas {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.45;
        }

        h1 {
            position: relative;
            font-size: clamp(2rem, 7vw, 3.8rem);
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff 0%, #ffe08a 40%, var(--fire-orange) 80%, var(--fire-red) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 24px rgba(255, 100, 0, 0.55));
            margin-bottom: 8px;
            animation: flicker 3.5s ease-in-out infinite;
        }

        @keyframes flicker {
            0%, 100% { filter: drop-shadow(0 0 24px rgba(255, 100, 0, 0.55)); }
            35% { filter: drop-shadow(0 0 36px rgba(255, 180, 0, 0.7)) brightness(1.05); }
            70% { filter: drop-shadow(0 0 18px rgba(255, 60, 0, 0.4)); }
        }

        .timer-bar {
            position: relative;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--fire-yellow);
            letter-spacing: 2px;
            opacity: 0.85;
        }

        .refresh-now {
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s;
        }
        .refresh-now:hover { color: #fff; }

        /* ===================== LAYOUT ===================== */
        /* ===================== LOG BAR ===================== */
        .log-bar-wrap {
            background: rgba(0, 0, 0, 0.45);
            border-bottom: 1px solid rgba(255, 100, 0, 0.1);
            flex-shrink: 0;
        }
        .log-bar-inner {
            max-width: 1500px;
            margin: 0 auto;
            padding: 6px 40px;
            height: 72px;
            overflow-y: auto;
            overflow-x: hidden;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #6a7d8f;
        }
        .log-bar-inner { scrollbar-width: none; -ms-overflow-style: none; }
        .log-bar-inner::-webkit-scrollbar { display: none; }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 28px 40px 32px;
            max-width: 1500px;
            margin: 0 auto;
            width: 100%;
            flex-grow: 1;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            max-height: 80vh;
        }

        .panel-header {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 14px;
            flex-shrink: 0;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--fire-yellow);
        }

        .badge {
            font-size: 9px;
            background: var(--fire-red);
            padding: 3px 7px;
            border-radius: 4px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* ===================== FILTERS ===================== */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
        }

        .filter-select, .filter-input {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,100,0,0.25);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 11px;
            padding: 6px 10px;
            outline: none;
            transition: border-color 0.2s;
        }
        .filter-select:focus, .filter-input:focus {
            border-color: var(--fire-orange);
        }
        .filter-input { flex: 1; min-width: 120px; }
        .filter-select option { background: #1a0800; }

        .filter-btn {
            background: rgba(255, 77, 0, 0.2);
            border: 1px solid rgba(255, 77, 0, 0.4);
            border-radius: 8px;
            color: var(--fire-orange);
            font-size: 11px;
            font-weight: 700;
            padding: 6px 14px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }
        .filter-btn:hover { background: rgba(255,77,0,0.4); color: #fff; }

        /* ===================== FEED LIST ===================== */
        .feed-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 6px;
            flex-grow: 1;
        }

        .feed-list::-webkit-scrollbar { width: 3px; }
        .feed-list::-webkit-scrollbar-thumb { background: rgba(255,100,0,0.3); border-radius: 10px; }

        /* ===================== JOBS PANEL — GREEN THEME ===================== */
        .panel--jobs {
            border-color: rgba(61, 220, 132, 0.22);
        }
        .panel--jobs .panel-header {
            border-bottom-color: rgba(61, 220, 132, 0.2);
        }
        .panel--jobs .panel-title {
            color: var(--jobs-green);
        }
        .panel--jobs .filter-select,
        .panel--jobs .filter-input {
            border-color: rgba(61, 220, 132, 0.28);
        }
        .panel--jobs .filter-select:focus,
        .panel--jobs .filter-input:focus {
            border-color: var(--jobs-green);
        }
        .panel--jobs .filter-select option { background: #001a0d; }
        .panel--jobs .filter-btn {
            background: rgba(61, 220, 132, 0.15);
            border-color: rgba(61, 220, 132, 0.4);
            color: var(--jobs-green);
        }
        .panel--jobs .filter-btn:hover {
            background: rgba(61, 220, 132, 0.35);
            color: #fff;
        }
        .panel--jobs .item-card:hover {
            background: rgba(61, 220, 132, 0.07);
            border-color: rgba(61, 220, 132, 0.45);
        }
        .panel--jobs .item-card::before {
            background: linear-gradient(to bottom, var(--jobs-green), rgba(61, 220, 132, 0.5));
        }
        .panel--jobs .card-source {
            color: var(--jobs-green);
        }
        .panel--jobs .tag-type {
            background: rgba(61, 220, 132, 0.12);
            color: var(--jobs-green);
        }
        .panel--jobs .feed-list::-webkit-scrollbar-thumb {
            background: rgba(61, 220, 132, 0.3);
        }

        /* log entries — shared by .log-bar */
        .log-entry { line-height: 1.6; padding: 2px 0; display: block; }

        /* ===================== CARDS ===================== */
        .item-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px 16px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.18s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            gap: 14px;
            align-items: flex-start;
            min-height: 72px;
        }

        a.item-card, a.item-card:visited { color: var(--text-main); }

        .item-card:hover {
            background: rgba(255, 80, 0, 0.08);
            border-color: rgba(255, 100, 0, 0.45);
            transform: translateX(3px);
        }

        .item-card::before {
            content: "";
            position: absolute;
            left: 0; top: 0;
            width: 3px; height: 100%;
            background: linear-gradient(to bottom, var(--fire-yellow), var(--fire-orange));
            opacity: 0;
            transition: opacity 0.2s;
            border-radius: 3px 0 0 3px;
        }
        .item-card:hover::before { opacity: 1; }

        /* Left gutter: source label + date stacked */
        .card-left {
            flex-shrink: 0;
            width: 72px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            padding-top: 2px;
        }

        .card-source {
            font-size: 8.5px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--fire-orange);
            font-weight: 700;
            line-height: 1.3;
            word-break: break-word;
        }

        .card-date {
            font-size: 9px;
            color: var(--text-dim);
            white-space: nowrap;
        }

        .card-badge-forum {
            display: inline-block;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.8px;
            padding: 1px 5px;
            margin-left: 6px;
            border-radius: 3px;
            background: rgba(93, 214, 255, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(93, 214, 255, 0.35);
            vertical-align: middle;
        }

        .filter-checkbox {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            color: var(--text-dim);
            cursor: pointer;
            user-select: none;
        }
        .filter-checkbox input { cursor: pointer; accent-color: var(--fire-orange); }

        /* Right body: title + desc + pay + tags */
        .card-body {
            flex: 1;
            min-width: 0;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 5px;
            color: #ffffff;
            white-space: normal;
        }

        .card-company {
            font-size: 10px;
            color: #9eb0c0;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .card-desc {
            font-size: 11px;
            color: #b0bec8;
            line-height: 1.5;
            margin-bottom: 7px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-pay {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 5px;
            letter-spacing: 0.3px;
        }

        .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .card-tag {
            font-size: 9px;
            padding: 2px 7px;
            border-radius: 3px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .tag-type { background: rgba(255, 204, 0, 0.12); color: var(--fire-yellow); }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-dim);
            font-style: italic;
            font-size: 13px;
        }

        .log-entry .t { color: var(--fire-yellow); margin-right: 6px; }
        .log-entry.error { color: #ff5577; }
        .log-entry.ok { color: #5dd6ff; }
        .log-entry.warn { color: #ffaa00; }

        /* ===================== RESPONSIVE ===================== */
        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; padding: 20px; }
            .panel { max-height: none; }
            .log-bar-inner { height: 56px; padding: 4px 20px; }
        }
    </style>
</head>

<script>
"use strict";

// ================================================
// FIRE CANVAS HEADER
// ================================================
(function() {
    const canvas = document.getElementById("fire-canvas");
    const ctx = canvas.getContext("2d");
    let W, H, particles = [];

    function resize() {
        W = canvas.width = canvas.offsetWidth;
        H = canvas.height = canvas.offsetHeight;
    }

    function Particle() {
        this.x = Math.random() * W;
        this.y = H + 10;
        this.vx = (Math.random() - 0.5) * 1.2;
        this.vy = -(1.5 + Math.random() * 3.5);
        this.alpha = 0.7 + Math.random() * 0.3;
        this.life = 0;
        this.maxLife = 55 + Math.random() * 80;
        this.size = 4 + Math.random() * 8;
    }

    Particle.prototype.update = function() {
        this.life++;
        this.x += this.vx + Math.sin(this.life * 0.12) * 0.5;
        this.y += this.vy;
        this.vy *= 0.99;
        this.alpha = (1 - this.life / this.maxLife) * 0.75;
        this.size *= 0.985;
    };

    Particle.prototype.draw = function() {
        const t = this.life / this.maxLife;
        const r = t < 0.5 ? 255 : Math.round(255 - (t - 0.5) * 2 * 100);
        const g = Math.round(200 * (1 - t));
        const b = 0;
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, this.size * 0.6, this.size, 0, 0, Math.PI * 2);
        ctx.fill();
    };

    function loop() {
        ctx.clearRect(0, 0, W, H);
        for (let i = 0; i < 5; i++) particles.push(new Particle());
        particles = particles.filter(p => p.life < p.maxLife);
        particles.forEach(p => { p.update(); p.draw(); });
        ctx.globalAlpha = 1;
        requestAnimationFrame(loop);
    }

    window.addEventListener("resize", resize);
    resize();
    loop();
})();


// ================================================
// APP STATE
// ================================================
const PROXY  = "https://api.allorigins.win/get?url=";
const PROXY2 = "https://api.codetabs.com/v1/proxy?quest=";

const CACHE_KEY = "thisisfine.cache.v1";
const CACHE_TTL = 30 * 60 * 1000; // 30 minutes

const state = { layoffs: [], jobs: [], filteredJobs: [] };

const timerEl    = document.getElementById("timer");
const layoffList = document.getElementById("layoffs-list");
const jobsList   = document.getElementById("jobs-list");
const jobsCount  = document.getElementById("jobs-count");
const logList    = document.getElementById("debug-log");


// ================================================
// CACHE (localStorage, 30-min TTL)
// ================================================
function saveCache() {
    try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
            ts: Date.now(),
            layoffs: state.layoffs,
            jobs: state.jobs,
        }));
    } catch {}
}

function tryLoadCache() {
    try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return false;
        const { ts, layoffs, jobs } = JSON.parse(raw);
        if (!ts || Date.now() - ts > CACHE_TTL) return false;
        if (!layoffs?.length && !jobs?.length) return false;
        state.layoffs = layoffs || [];
        state.jobs    = jobs    || [];
        state.filteredJobs = [...state.jobs];
        const age = Math.round((Date.now() - ts) / 60000);
        timerEl.textContent = new Date(ts).toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
        log(`⚡ Loaded from cache (${age} min old). Hit SCAN NOW to refresh.`, "warn");
        applyLayoffFilters();
        applyFilters();
        return true;
    } catch { return false; }
}


// ================================================
// LOGGING
// ================================================
function log(msg, type = "") {
    const el = document.createElement("div");
    el.className = `log-entry ${type}`;
    const now = new Date();
    const ts = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    el.innerHTML = `<span class="t">[${ts}]</span> ${esc(msg)}`;
    logList.appendChild(el);
    logList.scrollTop = logList.scrollHeight;
}

function pad(n) { return String(n).padStart(2, "0"); }


// ================================================
// FETCH HELPERS
// ================================================
async function fetchTimeout(url, ms = 12000) {
    const ctl = new AbortController();
    const tid = setTimeout(() => ctl.abort(), ms);
    try {
        const r = await fetch(url, { signal: ctl.signal });
        clearTimeout(tid);
        return r;
    } catch(e) {
        clearTimeout(tid);
        throw e;
    }
}

async function fetchJSON(url, ms) {
    const r = await fetchTimeout(url, ms);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
}

// Like fetchJSON, but if the direct call errors (CORS block, NetworkError, timeout),
// falls back to the allorigins → codetabs proxy chain. Used for third-party JSON APIs
// that are sometimes blocked by the user's ISP / network (Reddit, GDELT, HN Algolia).
async function fetchJSONSafe(url, ms = 12000) {
    try {
        return await fetchJSON(url, ms);
    } catch(directErr) {
        // Retry via proxy chain — fetchViaProxy already tries allorigins then codetabs
        const text = await fetchViaProxy(url);
        try {
            return JSON.parse(text);
        } catch(parseErr) {
            throw new Error(`proxy returned non-JSON: ${parseErr.message}`);
        }
    }
}

async function fetchViaProxy(url) {
    // Try allorigins first, fall back to codetabs
    try {
        const r = await fetchTimeout(`${PROXY}${encodeURIComponent(url)}`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const wrapper = await r.json();
        if (!wrapper.contents) throw new Error("empty contents");
        return wrapper.contents;
    } catch(e) {
        log(`  ⚡ allorigins failed (${e.message}), trying codetabs...`, "warn");
        const r2 = await fetchTimeout(`${PROXY2}${encodeURIComponent(url)}`);
        if (!r2.ok) throw new Error(`codetabs HTTP ${r2.status}`);
        return r2.text();
    }
}

async function parseRSS(text) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, "text/xml");
    return Array.from(doc.querySelectorAll("item")).map(item => ({
        title: item.querySelector("title")?.textContent?.trim() || "",
        url:   item.querySelector("link")?.textContent?.trim() || "",
        date:  item.querySelector("pubDate")?.textContent?.trim() || "",
        desc:  item.querySelector("description")?.textContent?.replace(/<[^>]*>/g,"").trim().slice(0,200) || "",
    }));
}

// Enhanced RSS parser: extracts <source> name and real URL from Google News description
async function parseRSSFull(text, defaultRegion = "global", defaultLang = "en") {
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, "text/xml");
    return Array.from(doc.querySelectorAll("item")).map(item => {
        const title   = item.querySelector("title")?.textContent?.trim() || "";
        const rawLink = item.querySelector("link")?.textContent?.trim() || "";
        const date    = item.querySelector("pubDate")?.textContent?.trim() ||
                        item.querySelector("published")?.textContent?.trim() || "";
        const descRaw = item.querySelector("description")?.textContent || "";
        // Try to pull the real URL from the description's first href
        const hrefM   = descRaw.match(/href=["']([^"']+)["']/);
        const url     = (hrefM && !hrefM[1].startsWith("https://news.google")) ? hrefM[1] : rawLink;
        const source  = item.querySelector("source")?.textContent?.trim() || "";
        const desc    = descRaw.replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim().slice(0, 220);
        return { title, url, date, source, desc, region: defaultRegion, lang: defaultLang };
    });
}

const LAYOFF_KEYWORDS = /layoff|laid.?off|job.?cut|fired|redundan|downsiz|retrench|workforce.?reduction|mass.?terminat|position.?eliminat|headcount/i;
const RSS2JSON = "https://api.rss2json.com/v1/api.json?rss_url=";
const CUTOFF_DAYS = 30;
const GDELT_BASE = "https://api.gdeltproject.org/api/v2/doc/doc";

// Parse GDELT seendate string ("20240423T120000Z") into ISO
function gdeltDate(s) {
    if (!s || s.length < 15) return "";
    return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T${s.slice(9,11)}:${s.slice(11,13)}:${s.slice(13,15)}Z`;
}

async function fetchLayoffs() {
    log("Scanning news feeds for layoff/firing coverage...");
    layoffList.innerHTML = `<div class="loading">Sensing the flames...</div>`;
    let all = [];
    const cutoff = Date.now() - CUTOFF_DAYS * 86400000;

    // ── Source 1: Google News RSS (replaces GDELT — aggregates Reuters/AP/Bloomberg/etc) ──
    // Uses parseRSSFull which extracts real article URLs and publisher names from Google's
    // <description> HTML, skipping the news.google.com/rss/articles/CBMi... redirect links.
    // when:${CUTOFF_DAYS}d scopes results to our rolling window.
    const GOOGLE_NEWS_QUERIES = [
        { label: "Google News — layoffs",       url: `https://news.google.com/rss/search?q=layoffs+when:${CUTOFF_DAYS}d&hl=en-US&gl=US&ceid=US:en`,                                                              region: "us"     },
        { label: "Google News — job cuts",      url: `https://news.google.com/rss/search?q=%22job+cuts%22+OR+%22laid+off%22+OR+%22workforce+reduction%22+when:${CUTOFF_DAYS}d&hl=en-US&gl=US&ceid=US:en`,      region: "us"     },
        { label: "Google News — tech layoffs",  url: `https://news.google.com/rss/search?q=tech+layoffs+OR+%22cutting+jobs%22+OR+downsizing+when:${CUTOFF_DAYS}d&hl=en-US&gl=US&ceid=US:en`,                  region: "us"     },
        { label: "Google News — EU redundancies", url: `https://news.google.com/rss/search?q=layoffs+OR+redundancies+OR+%22job+cuts%22+when:${CUTOFF_DAYS}d&hl=en-GB&gl=GB&ceid=GB:en`,                     region: "global" },
    ];
    for (let gi = 0; gi < GOOGLE_NEWS_QUERIES.length; gi++) {
        const gq = GOOGLE_NEWS_QUERIES[gi];
        try {
            log(`  → ${gq.label}...`);
            const text  = await fetchViaProxy(gq.url);
            const items = await parseRSSFull(text, gq.region, "en");
            const fresh = items.filter(i => LAYOFF_KEYWORDS.test(i.title) && i.date && new Date(i.date) >= cutoff);
            fresh.forEach(i => all.push({ ...i, type: "news" }));
            log(`  ✓ ${gq.label}: ${fresh.length} articles`, fresh.length ? "ok" : "warn");
        } catch(e) {
            log(`  ✗ ${gq.label} failed: ${e.message}`, "error");
        }
        if (gi < GOOGLE_NEWS_QUERIES.length - 1) await new Promise(r => setTimeout(r, 500));
    }

    // ── Source 2: TechCrunch /tag/layoffs/ — allorigins proxy (no rss2json 10-item cap) ──
    try {
        log("  → TechCrunch layoffs feed...");
        let tcItems = null;
        try {
            const text = await fetchViaProxy("https://techcrunch.com/tag/layoffs/feed/");
            tcItems = await parseRSS(text);
        } catch(proxyErr) {
            log(`  ⚡ TC proxy failed, trying rss2json...`, "warn");
            const data = await fetchJSON(RSS2JSON + encodeURIComponent("https://techcrunch.com/tag/layoffs/feed/"), 10000);
            if (data.status === "ok" && Array.isArray(data.items))
                tcItems = data.items.map(i => ({ title: i.title, url: i.link, date: i.pubDate, desc: (i.description||"").replace(/<[^>]*>/g,"").trim().slice(0,220) }));
        }
        if (tcItems) {
            const fresh = tcItems.filter(i => i.date && new Date(i.date) >= cutoff);
            fresh.forEach(i => all.push({ ...i, source: "TechCrunch", region: "us", lang: "en", type: "news" }));
            log(`  ✓ TechCrunch: ${fresh.length} articles`, fresh.length ? "ok" : "warn");
        } else throw new Error("no items");
    } catch(e) {
        log(`  ✗ TechCrunch failed: ${e.message}`, "error");
    }

    // ── Source 3: HN Algolia — link-post submissions only (no Ask HN / forum threads) ──
    // query=layoffs is a single keyword so Algolia doesn't AND-filter too aggressively.
    // Extra domain filter keeps only recognised news outlets or posts with headcount numbers.
    try {
        log("  → HN Algolia (layoffs)...");
        const data = await fetchJSONSafe(
            "https://hn.algolia.com/api/v1/search_by_date?query=layoffs&tags=story&hitsPerPage=100", 10000);
        const NEWS_DOMAINS = /techcrunch|reuters|bloomberg|wsj\.com|ft\.com|theverge|cnbc|bbc\.|fortune\.com|forbes|arstechnica|engadget|venturebeat|crunchbase|apnews|axios|wired\.com|businessinsider|theregister/i;
        const fresh = (data.hits || []).filter(h =>
            h.title && h.url && LAYOFF_KEYWORDS.test(h.title) &&
            new Date(h.created_at) >= cutoff &&
            (NEWS_DOMAINS.test(h.url) || /\b\d[\d,]*\s*(?:employees|workers|jobs|positions|staff|people)\b/i.test(h.title))
        );
        fresh.forEach(h => all.push({
            title: h.title, url: h.url, source: "Hacker News",
            date: h.created_at, desc: "", region: "global", lang: "en", type: "news",
        }));
        log(`  ✓ HN Algolia: ${fresh.length} stories (of ${data.hits?.length || 0} hits)`, fresh.length ? "ok" : "warn");
    } catch(e) {
        log(`  ✗ HN Algolia failed: ${e.message}`, "error");
    }

    // ── Source 4+: Keyword-filtered RSS wide net — dedicated tech journalism outlets ──
    const LAYOFF_RSS_FEEDS = [
        { url: "https://news.crunchbase.com/sections/layoffs/feed/", region: "us",     label: "Crunchbase",   prefilter: false },
        { url: "https://feeds.bbci.co.uk/news/business/rss.xml",     region: "uk",     label: "BBC Business", prefilter: true  },
        { url: "https://fortune.com/section/finance/feed/",          region: "us",     label: "Fortune",      prefilter: true  },
        { url: "https://www.theverge.com/rss/index.xml",             region: "us",     label: "The Verge",    prefilter: true  },
        { url: "https://arstechnica.com/feed/",                      region: "us",     label: "Ars Technica", prefilter: true  },
        { url: "https://www.engadget.com/rss.xml",                   region: "us",     label: "Engadget",     prefilter: true  },
    ];
    for (const feed of LAYOFF_RSS_FEEDS) {
        try {
            log(`  → ${feed.label} RSS...`);
            const text = await fetchViaProxy(feed.url);
            const items = await parseRSS(text);
            const fresh = items.filter(i => {
                if (feed.prefilter && !LAYOFF_KEYWORDS.test(i.title)) return false;
                return i.date && new Date(i.date) >= cutoff;
            });
            fresh.forEach(i => all.push({ ...i, source: feed.label, region: feed.region, lang: "en", type: "news" }));
            log(`  ✓ ${feed.label}: ${fresh.length} articles`, fresh.length ? "ok" : "warn");
        } catch(e) {
            log(`  ✗ ${feed.label} failed: ${e.message}`, "error");
        }
    }

    // Deduplicate: primary = URL, secondary = normalized title fingerprint (catches cross-published articles)
    const seen    = new Set();
    const seenFp  = new Set();
    all = all.filter(i => {
        const urlKey = (i.url && i.url !== "#") ? i.url : null;
        if (urlKey && seen.has(urlKey)) return false;
        const fp = i.title.toLowerCase().replace(/[^a-z0-9 ]/g, "").trim().slice(0, 80);
        if (seenFp.has(fp)) return false;
        if (urlKey) seen.add(urlKey);
        seenFp.add(fp);
        return true;
    });
    all.sort((a, b) => new Date(b.date) - new Date(a.date));

    state.layoffs = all;
    log(`Layoff scan done — ${all.length} recent articles (last ${CUTOFF_DAYS}d).`, all.length ? "ok" : "error");
    applyLayoffFilters();
}

function renderLayoffs(items) {
    if (!items.length) {
        layoffList.innerHTML = `<div class="loading">No layoff news found. (This is fine.)</div>`;
        return;
    }
    layoffList.innerHTML = items.map(i => `
        <a href="${esc(i.url)}" target="_blank" rel="noopener" class="item-card">
            <div class="card-left">
                <div class="card-source">${esc(i.source)}</div>
                <div class="card-date">${fmtDate(i.date)}</div>
            </div>
            <div class="card-body">
                <div class="card-title">${esc(i.title)}${i.type === "forum" ? `<span class="card-badge-forum">FORUM</span>` : ""}</div>
                ${i.desc ? `<div class="card-desc">${esc(i.desc)}</div>` : ""}
            </div>
        </a>
    `).join("");
}

async function fetchJobs() {

    jobsList.innerHTML = `<div class="loading">Searching the debris...</div>`;

    await Promise.allSettled([
        fetchRemotive(all),
        fetchRemoteOk(all),
        fetchArbeitnow(all),
        fetchJobicy(all),
        fetchHimalayas(all),
        fetchWWR(all),
        fetchGreenhouse(all),
    ]);

    // Deduplicate — include location so same title+company in different cities aren't collapsed
    const seen = new Set();
    all = all.filter(j => {
        const key = j.id || `${j.title}|${j.company}|${j.location || ""}`;
        if (seen.has(key)) return false; seen.add(key); return true;
    });

    all.sort((a, b) => new Date(b.date) - new Date(a.date));
    state.jobs = all;
    state.filteredJobs = [...all];
    log(`Job scan done — ${all.length} open positions.`, all.length ? "ok" : "error");
    applyFilters();
}

async function fetchArbeitnow(out) {
    try {
        log("  → Fetching Arbeitnow API...");
        // Arbeitnow is a free, CORS-friendly API — no proxy needed
        const data = await fetchJSON("https://www.arbeitnow.com/api/job-board-api?page=1", 12000);
        if (!data || !Array.isArray(data.data)) throw new Error("No data array");
        const cutoff = Date.now() - 45 * 86400000;
        let count = 0;
        data.data.forEach(j => {
            // created_at can be a Unix epoch (integer) or ISO string
            let d = null;
            if (j.created_at) {
                d = typeof j.created_at === "number"
                    ? new Date(j.created_at * 1000)
                    : new Date(j.created_at);
                if (isNaN(d)) d = null;
            }
            if (d && d < cutoff) return;
            const rawDesc = (j.description || "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim().slice(0, 220);
            const loc = (j.location || "").toLowerCase();
            // Detect language from title + description (umlauts, German patterns, m/w/d notation)
            const fullText = `${j.title || ""} ${rawDesc}`;
            const isGerman  = /[\u00e4\u00f6\u00fc\u00c4\u00d6\u00dc\u00df]|\(m\/w\/d\)|\(w\/m\/d\)|\(m\/f\/d\)|\(all genders\)|\bund\b|\bfür\b|\bbei\b|\bvon\b|\bmit\b|\bdie\b|\bder\b|\bdas\b|\bwir\b|\bSie\b|\bist\b|\bsind\b|\bals\b|\bauf\b/i.test(fullText);
            const isFrench  = /[\u00e0\u00e2\u00e9\u00e8\u00ea\u00eb\u00ee\u00ef\u00f4\u00f9\u00fb\u00e7]|\bdu\b|\bdes\b|\bune\b|\bpour\b|\bdans\b|\bvous\b/i.test(fullText);
            const detectedLang = isGerman ? "de" : isFrench ? "fr" : "en";
            out.push({
                id:       `abw-${j.slug}`,
                title:    j.title   || "(no title)",
                company:  j.company_name || "Unknown",
                source:   "Arbeitnow",
                url:      j.url    || `https://www.arbeitnow.com/jobs/${j.slug}`,
                type:     j.job_type || "full_time",
                category: j.tags  ? j.tags.join(", ") : "",
                salary:   extractSalary("", rawDesc),
                desc:     rawDesc,
                date:     d ? d.toISOString() : "",
                location: j.remote ? "remote" : (loc || "eu"),
                lang:     detectedLang,
            });
            count++;
        });
        log(`  ✓ Arbeitnow: ${count} active jobs`, "ok");
    } catch(e) {
        log(`  ✗ Arbeitnow failed: ${e.message}`, "error");
    }
}

function extractSalary(raw, desc) {
    if (raw) return String(raw).slice(0, 50);
    const m = desc.match(/[\$£€][\d,]+(?:k)?(?:\s*[-–]\s*[\$£€]?[\d,]+(?:k)?)?(?:\s*\/\s*(?:hr|hour|yr|year|mo))?/i);
    return m ? m[0] : "";
}

            log(`  ✓ ${feed.label}: ${fresh.length} jobs`, fresh.length ? "ok" : "warn");
        } catch(e) {
            log(`  ✗ ${feed.label} failed: ${e.message}`, "error");
        }
    }
}


// Category → regex map: matches against title + category tags + description
const CAT_KEYWORDS = {
    "software dev": /\b(engineer|developer|software|architect|frontend|back.?end|full.?stack|web dev|mobile|ios|android|react|vue|angular|node\.?js|python|java\b|ruby|golang|rust\b|php|typescript|kotlin|swift\b|rails|django|spring)/i,
    "devops":       /\b(devops|sre|site reliability|platform eng|infrastructure|infra|kubernetes|k8s|docker|cloud|aws|gcp|azure|terraform|ci.?cd|devsec|gitops|ansible)/i,
    "qa":           /\b(qa\b|quality assurance|quality engineer|test engineer|tester|sdet|automation test|manual test|selenium|playwright|cypress|jest|pytest|bug report|regression|test plan)/i,
    "security":     /\b(security|infosec|cybersec|pentest|penetration test|soc analyst|siem|threat|vulnerability|compliance|devsecops|iam\b|identity|zero.?trust|soc\b|cissp|ciso)/i,
    "design":       /\b(design|ux|ui\b|figma|product design|visual|graphic|creative|illustrator|motion|sketch\b)/i,
    "product":      /\b(product manager|product owner|\bpm\b|scrum|agile|roadmap|product ops|product lead)/i,
    "data":         /\b(data|analytics|analyst|machine learning|\bml\b|\bai\b|scientist|tableau|\bsql\b|bigquery|spark|databricks|\betl\b|\bbi\b|llm|nlp)/i,
    "writing":      /\b(technical writer|copywriter|content writer|editor|documentation|proposal writer|ux writer|content strategist|blogger|journalist|communications)/i,
    "marketing":    /\b(marketing|seo|sem|content|growth|social media|brand|campaign|email marketing|\bppc\b)/i,
    "finance":      /\b(financ|account|legal|compliance|tax|audit|controller|cfo|bookkeep|payroll)/i,
    "customer":     /\b(customer success|support|helpdesk|\bcx\b|client success|account manager|customer service|csm\b)/i,
    "sales":        /\b(sales|business development|\bbd\b|account executive|revenue|\bcrm\b|closing|quota|\bbdr\b|\bsdr\b)/i,
    "operations":   /\b(operations|ops\b|coordinator|administrator|office manager|project coordinator|program manager|supply chain|logistics|procurement|facilities)/i,
    "management":   /\b(manager|director|\bvp\b|head of|\bhr\b|recruiter|talent|people ops|chief|executive|ceo|cto)/i,
};

function applyFilters() {
    const kw      = document.getElementById("filter-keyword").value.toLowerCase().trim();
    const cat     = document.getElementById("filter-category").value.toLowerCase();
    const typ     = document.getElementById("filter-type").value;
    const pay     = parseInt(document.getElementById("filter-pay").value) || 0;
    const country = document.getElementById("filter-country").value.toLowerCase();
    const lang    = document.getElementById("filter-lang").value.toLowerCase();

    state.filteredJobs = state.jobs.filter(j => {
        if (kw && !`${j.title} ${j.company} ${j.desc}`.toLowerCase().includes(kw)) return false;
        // Use regex keyword matching against full title+category+desc for reliable results
        if (cat) {
            const re = CAT_KEYWORDS[cat];
            const txt = `${j.title} ${j.category} ${j.desc}`;
            if (re ? !re.test(txt) : !txt.toLowerCase().includes(cat)) return false;
        }
        if (typ && j.type && !j.type.includes(typ)) return false;
        if (country && j.location) {
            const loc = j.location.toLowerCase();
            const isOpenToAll = /remote|worldwide|anywhere|global/.test(loc);
            // Remote/worldwide jobs are accessible from any country — pass them through
            if (!isOpenToAll && !loc.includes(country)) return false;
        }
        if (lang && j.lang && j.lang !== lang) return false;
        if (pay && j.salary) {
            const nums = j.salary.match(/\d[\d,]*/g);
            if (nums) {
                const max = Math.max(...nums.map(n => parseInt(n.replace(/,/g,""))));
                const v = max < 1000 ? max * 1000 : max;
                if (v < pay * 1000) return false;
            }
        }
        return true;
    });

    // Always newest first
    state.filteredJobs.sort((a, b) => new Date(b.date) - new Date(a.date));
    renderJobs(state.filteredJobs);
}

function resetFilters() {
    ["filter-keyword","filter-category","filter-type","filter-pay","filter-country","filter-lang"]
        .forEach(id => document.getElementById(id).value = "");
    applyFilters();
}

// ================================================
// FILTERS — CUTS
// ================================================
function applyLayoffFilters() {
    const kw        = document.getElementById("cuts-keyword").value.toLowerCase().trim();
    const country   = document.getElementById("cuts-country").value.toLowerCase();
    const lang      = document.getElementById("cuts-lang").value.toLowerCase();
    const hideForum = document.getElementById("cuts-hide-forum").checked;

    let filtered = state.layoffs.filter(i => {
        if (hideForum && i.type === "forum") return false;
        if (kw && !i.title.toLowerCase().includes(kw)) return false;
        if (country) {
            // Items tagged "global" pass all region filters; otherwise must match
            const reg = (i.region || "global").toLowerCase();
            if (reg !== "global" && reg !== country) return false;
        }
        if (lang && (i.lang || "en") !== lang) return false;
        return true;
    });

    filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

    const cutsCount = document.getElementById("cuts-count");
    cutsCount.textContent = filtered.length
        ? `Showing ${filtered.length} article${filtered.length === 1 ? "" : "s"}`
        : "";
    renderLayoffs(filtered);
}

function resetLayoffFilters() {
    ["cuts-keyword","cuts-country","cuts-lang"]
        .forEach(id => document.getElementById(id).value = "");
    document.getElementById("cuts-hide-forum").checked = true;
    applyLayoffFilters();
}

const TYPE_LABELS = { full_time: "Full-Time", part_time: "Part-Time", contract: "Contract", freelance: "Freelance" };

function renderJobs(items) {
    jobsCount.textContent = items.length
        ? `Showing ${items.length} position${items.length === 1 ? "" : "s"}`
        : "";

    if (!items.length) {
        jobsList.innerHTML = `<div class="loading">No matches. Adjust filters or wait for next scan.</div>`;
        return;
    }

    jobsList.innerHTML = items.map(j => `
        <a href="${esc(j.url)}" target="_blank" rel="noopener" class="item-card">
            <div class="card-left">
                <div class="card-source">${esc(j.source)}</div>
                <div class="card-date">${fmtDate(j.date)}</div>
            </div>
            <div class="card-body">
                <div class="card-title">${esc(j.title)}</div>
                <div class="card-company">${esc(j.company)}</div>
                ${j.salary ? `<div class="card-pay">💰 ${esc(j.salary)}</div>` : ""}
                ${j.desc ? `<div class="card-desc">${esc(j.desc)}</div>` : ""}
                ${j.type ? `<div class="card-meta"><span class="card-tag tag-type">${esc(TYPE_LABELS[j.type] || j.type)}</span></div>` : ""}
            </div>
        </a>
    `).join("");
}


// ================================================
// REFRESH
// ================================================
async function refreshAll() {
    timerEl.textContent = new Date().toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
    log("══════════ NEW SCAN INITIATED ══════════", "ok");
    // Serialize: layoffs first, then jobs. Reduces concurrent network pressure so
    // GDELT's 14s timeout doesn't fire while 20+ job-board requests are in flight.
    await fetchLayoffs();
    await fetchJobs();
    saveCache();
    log("══════════ SCAN COMPLETE ══════════");
}


// ================================================
// UTILS
// ================================================
function esc(s) {
    return String(s || "").replace(/[&<>"']/g, c =>
        ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function fmtDate(raw) {
    try {
        const d = new Date(raw);
        if (isNaN(d)) return raw || "—";
        return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    } catch { return raw || "—"; }
}

document.getElementById("cuts-lang").value = "en";
document.getElementById("filter-country").value = "us";
document.getElementById("filter-lang").value = "en";
if (!tryLoadCache()) refreshAll();
