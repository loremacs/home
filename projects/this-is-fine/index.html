<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThisIsFine — Layoffs & Jobs Tracker</title>
    <style>
        :root {
            --fire-orange: #ff4d00;
            --fire-yellow: #ffcc00;
            --fire-red: #cc0000;
            --bg-dark: #0f0500;
            --card-bg: rgba(30, 10, 0, 0.7);
            --glass-border: rgba(255, 100, 0, 0.2);
            --text-main: #fff5f0;
            --text-dim: #b3a099;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background: radial-gradient(circle at center, #2e0f00 0%, #0f0500 100%);
        }

        /* Animated Flame Background */
        .flame-container {
            position: fixed;
            bottom: -50px;
            left: 0;
            width: 100%;
            height: 200px;
            pointer-events: none;
            z-index: -1;
            opacity: 0.3;
            filter: blur(20px);
        }

        header {
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(15, 5, 0, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 900;
            letter-spacing: -2px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff, var(--fire-orange), var(--fire-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255, 77, 0, 0.4));
            margin-bottom: 10px;
            animation: flicker 4s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(0.99); }
        }

        .timer-container {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--fire-yellow);
            letter-spacing: 2px;
            opacity: 0.8;
        }

        .refresh-now {
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s;
        }
        .refresh-now:hover { color: #fff; }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 24px;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-height: 80vh;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--fire-yellow);
        }

        .badge {
            font-size: 10px;
            background: var(--fire-red);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 800;
        }

        .feed-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 10px;
        }

        .feed-list::-webkit-scrollbar { width: 4px; }
        .feed-list::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }

        .item-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .item-card:hover {
            background: rgba(255, 100, 0, 0.08);
            border-color: var(--fire-orange);
            transform: translateX(5px);
        }

        .item-card .source {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--fire-orange);
            margin-bottom: 6px;
            display: block;
        }

        .item-card .title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 8px;
            display: block;
        }

        .item-card .meta {
            font-size: 11px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
            font-style: italic;
        }

        /* Fire effect in cards */
        .item-card::after {
            content: "";
            position: absolute;
            top: 0; right: 0;
            width: 2px; height: 100%;
            background: linear-gradient(to bottom, var(--fire-yellow), var(--fire-red));
            opacity: 0.3;
        }

        @media (max-width: 600px) {
            .dashboard { padding: 20px; grid-template-columns: 1fr; }
            .panel { max-height: none; }
        }
    </style>
</head>
<body>

    <header>
        <h1>THIS IS FINE</h1>
        <div class="timer-container">
            NEXT SCAN IN <span id="timer">05:00</span> // <span class="refresh-now" onclick="refreshAll()">SCAN NOW</span>
        </div>
    </header>

    <div class="dashboard">
        <!-- LAYOFFS NEWS PANEL -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">THE CUTS</div>
                <div class="badge">LIVE NEWS</div>
            </div>
            <div id="layoffs-list" class="feed-list">
                <div class="loading">Sensing the flames...</div>
            </div>
        </div>

        <!-- JOB LISTINGS PANEL -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">THE OPPORTUNITIES</div>
                <div class="badge">OPEN POSITIONS</div>
            </div>
            <div id="jobs-list" class="feed-list">
                <div class="loading">Searching the debris...</div>
            </div>
        </div>
    </div>

    <div class="flame-container">
        <!-- SVG Flames could go here -->
    </div>

    <script>
        "use strict";

        const POLL_INTERVAL = 5 * 60; // 5 minutes in seconds
        let secondsLeft = POLL_INTERVAL;
        let timerInterval;

        const CORS_PROXY = "https://api.allorigins.win/get?url=";

        // Data Management
        const state = {
            layoffs: [],
            jobs: []
        };

        // UI Refs
        const timerEl = document.getElementById("timer");
        const layoffsList = document.getElementById("layoffs-list");
        const jobsList = document.getElementById("jobs-list");

        function updateTimer() {
            const m = Math.floor(secondsLeft / 60);
            const s = secondsLeft % 60;
            timerEl.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            if (secondsLeft <= 0) {
                refreshAll();
            } else {
                secondsLeft--;
            }
        }

        async function refreshAll() {
            secondsLeft = POLL_INTERVAL;
            console.log("Polling for updates...");
            fetchLayoffs();
            fetchJobs();
        }

        // --- FETCHERS ---

        async function fetchLayoffs() {
            try {
                // GDELT for general news about layoffs
                const gdeltUrl = `https://api.gdeltproject.org/api/v2/doc/doc?query=layoffs%20OR%20"job%20cuts"%20OR%20"firings"&mode=artlist&format=json&maxresults=25`;
                // Use proxy to avoid CORS/Rate limits if needed, but GDELT is usually open.
                const resp = await fetch(gdeltUrl);
                const data = await resp.json();
                
                if (data.articles) {
                    state.layoffs = data.articles.map(a => ({
                        title: a.title,
                        url: a.url,
                        source: a.sourcecountry || "World News",
                        date: a.seendate.split('T')[0]
                    }));
                    renderList(layoffsList, state.layoffs);
                }
            } catch (e) {
                console.error("GDELT fetch failed", e);
                layoffsList.innerHTML = `<div class="loading">Signal disrupted. Retrying...</div>`;
            }
        }

        async function fetchJobs() {
            try {
                // Hacker News Algolia for hiring threads
                const hnUrl = `https://hn.algolia.com/api/v1/search?query="Who%20is%20hiring"&tags=story&hitsPerPage=3`;
                const hnResp = await fetch(hnUrl);
                const hnData = await hnResp.json();
                
                let combinedJobs = [];

                // HN Threads
                if (hnData.hits) {
                    hnData.hits.forEach(hit => {
                        combinedJobs.push({
                            title: hit.title,
                            url: `https://news.ycombinator.com/item?id=${hit.objectID}`,
                            source: "Hacker News",
                            date: hit.created_at.split('T')[0]
                        });
                    });
                }

                // RemoteOK API (requires proxy usually)
                const remoteOkUrl = encodeURIComponent("https://remoteok.com/remote-jobs.json");
                const roResp = await fetch(`${CORS_PROXY}${remoteOkUrl}`);
                const roData = await roResp.json();
                const items = JSON.parse(roData.contents);
                
                if (Array.isArray(items)) {
                    // Filter out non-job objects
                    items.slice(1, 20).forEach(job => {
                        combinedJobs.push({
                            title: `${job.position} @ ${job.company}`,
                            url: job.url,
                            source: "RemoteOK",
                            date: new Date(job.date).toISOString().split('T')[0]
                        });
                    });
                }
                
                state.jobs = combinedJobs.sort((a,b) => new Date(b.date) - new Date(a.date));
                renderList(jobsList, state.jobs);
            } catch (e) {
                console.error("Jobs fetch failed", e);
                jobsList.innerHTML = `<div class="loading">Opportunities hidden in smoke. Retrying...</div>`;
            }
        }

        // --- RENDERING ---

        function renderList(container, items) {
            if (!items.length) {
                container.innerHTML = `<div class="loading">Nothing found. This is fine.</div>`;
                return;
            }
            container.innerHTML = items.map(item => `
                <a href="${item.url}" target="_blank" class="item-card">
                    <span class="source">${item.source}</span>
                    <span class="title">${escapeHtml(item.title)}</span>
                    <div class="meta">
                        <span>${item.date}</span>
                        <span>READ MORE →</span>
                    </div>
                </a>
            `).join("");
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, (c) =>
                ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
        }

        // --- INIT ---

        function init() {
            setInterval(updateTimer, 1000);
            refreshAll();
        }

        init();
    </script>
</body>
</html>
