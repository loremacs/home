<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logic Lab — Gate Puzzle</title>
<style>
:root{--bg:#060d06;--panel:rgba(6,16,6,.97);--border:rgba(0,200,80,.18);--accent:#00cc44;--adim:rgba(0,200,80,.12);--txt:#aaffcc;--dim:#3a6a3a;--mut:#5a8a5a;--pass:#00ff66;--fail:#ff4466;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:'Courier New',monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none;}
#hdr{background:rgba(4,12,4,.98);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:20px;flex-shrink:0;}
#hdr h1{font-size:15px;letter-spacing:3px;color:var(--accent);}
#hdr small{font-size:10px;color:var(--mut);letter-spacing:1px;}
#app{display:flex;flex:1;overflow:hidden;}
#pal{width:148px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;padding:10px 8px;gap:5px;flex-shrink:0;}
.pal-hdr{font-size:9px;letter-spacing:2px;color:var(--mut);padding:4px 4px 8px;border-bottom:1px solid var(--border);margin-bottom:2px;}
.pi{background:rgba(0,150,60,.07);border:1px solid var(--border);border-radius:7px;padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:all .15s;}
.pi:hover:not(.dep){background:var(--adim);border-color:var(--accent);}
.pi.sel{background:rgba(0,200,80,.2);border-color:var(--accent);box-shadow:0 0 8px rgba(0,200,80,.3);}
.pi.dep{opacity:.3;cursor:not-allowed;}
.pi-t{font-size:12px;font-weight:bold;color:var(--txt);letter-spacing:1px;}
.pi-c{font-size:10px;color:var(--mut);}
#ws{flex:1;overflow:auto;background:#050e05;display:flex;align-items:flex-start;justify-content:center;padding:10px;}
#svg{display:block;border:1px solid rgba(0,200,80,.1);border-radius:4px;}
#tp{width:268px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;}
.ti{padding:14px;flex:1;}
.pt{font-size:14px;font-weight:bold;color:var(--accent);letter-spacing:1px;margin-bottom:5px;}
.pf{font-size:10px;color:var(--mut);line-height:1.6;margin-bottom:12px;}
.th{font-size:9px;letter-spacing:2px;color:var(--mut);margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:12px;}
th{color:var(--mut);font-size:9px;letter-spacing:1px;padding:3px 4px;text-align:center;border-bottom:1px solid var(--border);}
td{padding:4px;text-align:center;border-bottom:1px solid rgba(0,200,80,.06);}
td.sep{color:var(--border);padding:0 2px;}
tr.rp td{background:rgba(0,255,102,.04);}
tr.rf td{background:rgba(255,68,102,.04);}
.vp{color:var(--pass);font-weight:bold;}
.vf{color:var(--fail);font-weight:bold;}
tr.rp .si{color:var(--pass);}
tr.rf .si{color:var(--fail);}
.pb{background:rgba(0,255,102,.1);border:1px solid rgba(0,255,102,.4);border-radius:7px;padding:10px;text-align:center;font-size:12px;font-weight:bold;color:var(--pass);letter-spacing:2px;margin-bottom:8px;animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(0,255,102,.3);}50%{box-shadow:0 0 20px rgba(0,255,102,.6);}}
.nav{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);flex-shrink:0;}
.nav button{background:var(--adim);border:1px solid var(--border);border-radius:6px;color:var(--accent);font-family:inherit;font-size:10px;font-weight:bold;letter-spacing:1px;padding:6px 10px;cursor:pointer;transition:all .15s;}
.nav button:hover:not(:disabled){background:rgba(0,200,80,.25);border-color:var(--accent);}
.nav button:disabled{opacity:.3;cursor:not-allowed;}
.nav span{font-size:10px;color:var(--mut);}
.hint{padding:10px 14px;font-size:9px;color:var(--dim);line-height:2;border-top:1px solid var(--border);flex-shrink:0;}
.hint b{color:var(--mut);}
</style>
</head>
<body>
<div id="hdr"><h1>⚡ LOGIC LAB</h1><small>GATE PUZZLE SIMULATOR</small></div>
<div id="app">
  <aside id="pal"></aside>
  <main id="ws">
    <svg id="svg" width="864" height="576" viewBox="0 0 864 576">
      <defs>
        <pattern id="gp" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
          <circle cx="24" cy="24" r="1" fill="rgba(0,200,80,.14)"/>
        </pattern>
        <pattern id="gm" x="0" y="0" width="144" height="144" patternUnits="userSpaceOnUse">
          <rect width="144" height="144" fill="none" stroke="rgba(0,200,80,.05)" stroke-width=".5"/>
        </pattern>
      </defs>
      <rect width="864" height="576" fill="#050e05"/>
      <rect width="864" height="576" fill="url(#gm)"/>
      <rect width="864" height="576" fill="url(#gp)"/>
    </svg>
  </main>
  <aside id="tp"></aside>
</div>
<script>
const CELL=48,COLS=18,ROWS=12,NS="http://www.w3.org/2000/svg";
const svgEl=document.getElementById('svg');

const DEFS={
  AND: {label:"AND",ins:2,outs:1,cw:3,ch:2,fill:"#091a09",stroke:"#1a5c24"},
  OR:  {label:"OR", ins:2,outs:1,cw:3,ch:2,fill:"#091016",stroke:"#1a3a5c"},
  NOT: {label:"NOT",ins:1,outs:1,cw:2,ch:1,fill:"#180909",stroke:"#5c1a1a"},
  NAND:{label:"NAND",ins:2,outs:1,cw:3,ch:2,fill:"#130916",stroke:"#3a1a5c"},
  NOR: {label:"NOR",ins:2,outs:1,cw:3,ch:2,fill:"#161009",stroke:"#5c3a1a"},
  XOR: {label:"XOR",ins:2,outs:1,cw:3,ch:2,fill:"#091614",stroke:"#1a5c4a"},
  BUF: {label:"BUF",ins:1,outs:1,cw:2,ch:1,fill:"#09090e",stroke:"#1a1a5c"},
  IN:  {label:"IN", ins:0,outs:1,cw:2,ch:1,fill:"#001400",stroke:"#00aa44",fixed:true},
  OUT: {label:"OUT",ins:1,outs:0,cw:2,ch:1,fill:"#140006",stroke:"#aa0044",fixed:true},
};
const EVAL={
  AND: i=>i[0]&i[1], OR:i=>i[0]|i[1], NOT:i=>i[0]^1,
  NAND:i=>(i[0]&i[1])^1, NOR:i=>(i[0]|i[1])^1, XOR:i=>i[0]^i[1],
  BUF: i=>i[0], IN:(i,c)=>c.value||0, OUT:i=>i[0]??0,
};

const PUZZLES=[
  {id:1,name:"NOT Gate",flavor:"Route signal A through a single inverter to reach Y. HIGH becomes LOW, LOW becomes HIGH.",
   inputs:[{name:"A",gy:5}],outputs:[{name:"Y",gy:5}],available:{NOT:2,BUF:1},
   testCases:[{inputs:{A:0},expected:{Y:1}},{inputs:{A:1},expected:{Y:0}}]},
  {id:2,name:"AND Gate",flavor:"Y is HIGH only when both A and B are HIGH. Transistors in series.",
   inputs:[{name:"A",gy:4},{name:"B",gy:7}],outputs:[{name:"Y",gy:5}],available:{AND:2,OR:1,NOT:2},
   testCases:[{inputs:{A:0,B:0},expected:{Y:0}},{inputs:{A:0,B:1},expected:{Y:0}},{inputs:{A:1,B:0},expected:{Y:0}},{inputs:{A:1,B:1},expected:{Y:1}}]},
  {id:3,name:"OR Gate",flavor:"Y is HIGH when at least one input is HIGH. Transistors in parallel.",
   inputs:[{name:"A",gy:4},{name:"B",gy:7}],outputs:[{name:"Y",gy:5}],available:{AND:1,OR:2,NOT:2},
   testCases:[{inputs:{A:0,B:0},expected:{Y:0}},{inputs:{A:0,B:1},expected:{Y:1}},{inputs:{A:1,B:0},expected:{Y:1}},{inputs:{A:1,B:1},expected:{Y:1}}]},
  {id:4,name:"XOR from Primitives",flavor:"Y is HIGH when inputs differ. No XOR gate — build it from AND, OR, NOT.",
   inputs:[{name:"A",gy:4},{name:"B",gy:7}],outputs:[{name:"Y",gy:5}],available:{AND:3,OR:3,NOT:3,BUF:2},
   testCases:[{inputs:{A:0,B:0},expected:{Y:0}},{inputs:{A:0,B:1},expected:{Y:1}},{inputs:{A:1,B:0},expected:{Y:1}},{inputs:{A:1,B:1},expected:{Y:0}}]},
  {id:5,name:"NAND Gate",flavor:"The universal gate. LOW only when both inputs are HIGH.",
   inputs:[{name:"A",gy:4},{name:"B",gy:7}],outputs:[{name:"Y",gy:5}],available:{AND:2,NOT:2,NAND:1},
   testCases:[{inputs:{A:0,B:0},expected:{Y:1}},{inputs:{A:0,B:1},expected:{Y:1}},{inputs:{A:1,B:0},expected:{Y:1}},{inputs:{A:1,B:1},expected:{Y:0}}]},
  {id:6,name:"Majority Vote",flavor:"Y is HIGH when 2 or more of the three inputs are HIGH.",
   inputs:[{name:"A",gy:2},{name:"B",gy:5},{name:"C",gy:8}],outputs:[{name:"Y",gy:5}],available:{AND:3,OR:3,NOT:2},
   testCases:[{inputs:{A:0,B:0,C:0},expected:{Y:0}},{inputs:{A:1,B:0,C:0},expected:{Y:0}},{inputs:{A:0,B:1,C:0},expected:{Y:0}},{inputs:{A:0,B:0,C:1},expected:{Y:0}},{inputs:{A:1,B:1,C:0},expected:{Y:1}},{inputs:{A:1,B:0,C:1},expected:{Y:1}},{inputs:{A:0,B:1,C:1},expected:{Y:1}},{inputs:{A:1,B:1,C:1},expected:{Y:1}}]},
  {id:7,name:"Half Adder",flavor:"Add two 1-bit numbers. SUM = ones place, CRY = carry (twos place).",
   inputs:[{name:"A",gy:4},{name:"B",gy:7}],outputs:[{name:"SUM",gy:4},{name:"CRY",gy:7}],available:{XOR:2,AND:2,OR:1,NOT:1},
   testCases:[{inputs:{A:0,B:0},expected:{SUM:0,CRY:0}},{inputs:{A:0,B:1},expected:{SUM:1,CRY:0}},{inputs:{A:1,B:0},expected:{SUM:1,CRY:0}},{inputs:{A:1,B:1},expected:{SUM:0,CRY:1}}]},
  {id:8,name:"2:1 Multiplexer",flavor:"SEL=0 routes A to Y; SEL=1 routes B to Y. A signal railway switch.",
   inputs:[{name:"A",gy:2},{name:"B",gy:5},{name:"SEL",gy:9}],outputs:[{name:"Y",gy:5}],available:{AND:3,OR:2,NOT:2},
   testCases:[{inputs:{A:0,B:0,SEL:0},expected:{Y:0}},{inputs:{A:1,B:0,SEL:0},expected:{Y:1}},{inputs:{A:0,B:1,SEL:0},expected:{Y:0}},{inputs:{A:1,B:1,SEL:0},expected:{Y:1}},{inputs:{A:0,B:0,SEL:1},expected:{Y:0}},{inputs:{A:1,B:0,SEL:1},expected:{Y:0}},{inputs:{A:0,B:1,SEL:1},expected:{Y:1}},{inputs:{A:1,B:1,SEL:1},expected:{Y:1}}]},
  {id:9,name:"Equality Detector",flavor:"Y is HIGH when A and B carry the same value. Core of CPU comparators.",
   inputs:[{name:"A",gy:4},{name:"B",gy:7}],outputs:[{name:"Y",gy:5}],available:{XOR:2,NOT:2,AND:1},
   testCases:[{inputs:{A:0,B:0},expected:{Y:1}},{inputs:{A:0,B:1},expected:{Y:0}},{inputs:{A:1,B:0},expected:{Y:0}},{inputs:{A:1,B:1},expected:{Y:1}}]},
  {id:10,name:"2-to-4 Decoder",flavor:"Two address bits select one of four outputs. Exactly one output is HIGH. Core of every memory chip.",
   inputs:[{name:"A",gy:3},{name:"B",gy:8}],outputs:[{name:"Y0",gy:1},{name:"Y1",gy:4},{name:"Y2",gy:7},{name:"Y3",gy:10}],available:{AND:4,NOT:2},
   testCases:[{inputs:{A:0,B:0},expected:{Y0:1,Y1:0,Y2:0,Y3:0}},{inputs:{A:0,B:1},expected:{Y0:0,Y1:1,Y2:0,Y3:0}},{inputs:{A:1,B:0},expected:{Y0:0,Y1:0,Y2:1,Y3:0}},{inputs:{A:1,B:1},expected:{Y0:0,Y1:0,Y2:0,Y3:1}}]},
];

let state={components:[],wires:[],puzzle:null,puzzleIdx:0,signals:{}};
let nid=1,placing=null,ghostPos=null,wiringFrom=null,tempEnd=null,moving=null;

function pinPos(comp,side,idx){
  const d=DEFS[comp.type],pw=d.cw*CELL,ph=d.ch*CELL;
  if(side==='out'){const s=ph/(d.outs+1);return{x:comp.gx*CELL+pw,y:comp.gy*CELL+s*(idx+1)};}
  const s=ph/(d.ins+1);return{x:comp.gx*CELL,y:comp.gy*CELL+s*(idx+1)};
}
function svgXY(e){const r=svgEl.getBoundingClientRect(),vw=864,vh=576;return{x:(e.clientX-r.left)*(vw/r.width),y:(e.clientY-r.top)*(vh/r.height)};}
function snap(x,y,t){const d=DEFS[t];return{gx:Math.max(0,Math.min(COLS-d.cw,Math.round(x/CELL))),gy:Math.max(0,Math.min(ROWS-d.ch,Math.round(y/CELL)))};}
function occ(gx,gy,cw,ch,skip){for(const c of state.components){if(c.id===skip)continue;const d=DEFS[c.type];if(gx<c.gx+d.cw&&gx+cw>c.gx&&gy<c.gy+d.ch&&gy+ch>c.gy)return true;}return false;}
function mk(tag,a){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e;}

function simulate(ov={}){
  const out={};
  for(const c of state.components)if(c.type==='IN')out[c.id]=(c.name in ov)?ov[c.name]:(c.value||0);
  const wm={};for(const w of state.wires)wm[`${w.to}_${w.tp}`]=w;
  const deps={},rdeps={};
  for(const c of state.components){deps[c.id]=new Set();rdeps[c.id]=new Set();}
  for(const w of state.wires)if(w.from!==w.to){deps[w.to].add(w.from);rdeps[w.from].add(w.to);}
  const q=state.components.filter(c=>deps[c.id].size===0).map(c=>c.id),done=new Set();
  while(q.length){
    const id=q.shift();if(done.has(id))continue;done.add(id);
    const c=state.components.find(x=>x.id===id);if(!c||c.type==='IN'){}
    else{const d=DEFS[c.type],ins=[];
      for(let i=0;i<d.ins;i++){const w=wm[`${c.id}_${i}`];ins.push(w?(out[w.from]??0):0);}
      out[c.id]=EVAL[c.type]?EVAL[c.type](ins,c):0;}
    for(const dep of rdeps[id]){deps[dep].delete(id);if(deps[dep].size===0)q.push(dep);}
  }
  state.signals=out;return out;
}

function runTests(p){
  return p.testCases.map(tc=>{
    const sig=simulate(tc.inputs),results={};let allPass=true;
    for(const[name,exp]of Object.entries(tc.expected)){
      const oc=state.components.find(c=>c.type==='OUT'&&c.name===name);
      const actual=oc?(sig[oc.id]??0):null,pass=actual===exp;
      results[name]={exp,actual,pass};if(!pass)allPass=false;
    }
    return{inputs:tc.inputs,results,allPass};
  });
}

function render(){
  while(svgEl.children.length>4)svgEl.removeChild(svgEl.lastChild);
  simulate();const sig=state.signals;
  const wm={};for(const w of state.wires)wm[`${w.to}_${w.tp}`]=w;

  // Wires
  const wg=mk('g',{});
  for(const w of state.wires){
    const fc=state.components.find(c=>c.id===w.from),tc=state.components.find(c=>c.id===w.to);
    if(!fc||!tc)continue;
    const p1=pinPos(fc,'out',w.fp),p2=pinPos(tc,'in',w.tp),mx=(p1.x+p2.x)/2;
    const hot=(sig[w.from]??0)===1;
    wg.appendChild(mk('path',{d:`M${p1.x} ${p1.y} C${mx} ${p1.y} ${mx} ${p2.y} ${p2.x} ${p2.y}`,
      stroke:hot?'#00ff66':'#193319','stroke-width':hot?2.5:1.5,fill:'none',class:'wire','data-wid':w.id,cursor:'pointer'}));
  }
  svgEl.appendChild(wg);

  // Temp wire
  if(wiringFrom&&tempEnd){
    const fc=state.components.find(c=>c.id===wiringFrom.cid);
    if(fc){const p1=pinPos(fc,'out',wiringFrom.pi),mx=(p1.x+tempEnd.x)/2;
      svgEl.appendChild(mk('path',{d:`M${p1.x} ${p1.y} C${mx} ${p1.y} ${mx} ${tempEnd.y} ${tempEnd.x} ${tempEnd.y}`,
        stroke:'#00cc44','stroke-width':2,fill:'none','stroke-dasharray':'6 4','pointer-events':'none'}));}
  }

  // Components
  const cg=mk('g',{});
  for(const comp of state.components){
    const d=DEFS[comp.type],pw=d.cw*CELL,ph=d.ch*CELL,hot=(sig[comp.id]??0)===1;
    const g=mk('g',{class:'cg','data-id':comp.id,transform:`translate(${comp.gx*CELL},${comp.gy*CELL})`});
    g.appendChild(mk('rect',{x:4,y:4,width:pw-8,height:ph-8,rx:7,fill:d.fill,
      stroke:comp.type==='OUT'&&hot?'#ff4466':hot?'#00ff66':d.stroke,'stroke-width':1.5,class:'cb',cursor:comp.fixed?'default':'grab'}));
    const lb=mk('text',{x:pw/2,y:ph/2,'text-anchor':'middle','dominant-baseline':'middle',
      fill:'#88ffaa','font-size':11,'font-family':'monospace','font-weight':'bold','pointer-events':'none'});
    lb.textContent=comp.name||d.label;g.appendChild(lb);
    if(comp.type==='IN'){
      const v=sig[comp.id]??0,vt=mk('text',{x:pw-8,y:ph/2+8,'text-anchor':'end','dominant-baseline':'middle',
        fill:v?'#00ff66':'#336633','font-size':13,'font-weight':'bold','font-family':'monospace','pointer-events':'none'});
      vt.textContent=v?'1':'0';g.appendChild(vt);
    }
    if(comp.type==='OUT'){
      const v=sig[comp.id]??0;
      g.appendChild(mk('circle',{cx:pw-14,cy:ph/2,r:5,fill:v?'#ff4466':'#330011','pointer-events':'none'}));
    }
    for(let i=0;i<d.ins;i++){
      const s=ph/(d.ins+1),py=s*(i+1),wk=`${comp.id}_${i}`,ph2=wm[wk]?(sig[wm[wk].from]??0)===1:false;
      g.appendChild(mk('circle',{cx:0,cy:py,r:5,fill:ph2?'#00ff66':'#1a3a1a',stroke:'#00aa44','stroke-width':1.5,
        class:'pin pi','data-ci':comp.id,'data-pi':i,cursor:'crosshair'}));
    }
    for(let i=0;i<d.outs;i++){
      const s=ph/(d.outs+1),py=s*(i+1),ph2=(sig[comp.id]??0)===1;
      g.appendChild(mk('circle',{cx:pw,cy:py,r:5,fill:ph2?'#00ff66':'#1a3a1a',stroke:'#00aa44','stroke-width':1.5,
        class:'pin po','data-ci':comp.id,'data-pi':i,cursor:'crosshair'}));
    }
    cg.appendChild(g);
  }
  svgEl.appendChild(cg);

  // Ghost
  if(placing&&ghostPos){
    const d=DEFS[placing],pw=d.cw*CELL,ph=d.ch*CELL,gx=ghostPos.gx*CELL,gy=ghostPos.gy*CELL;
    const gh=mk('g',{'pointer-events':'none'});
    gh.appendChild(mk('rect',{x:gx,y:gy,width:pw,height:ph,rx:7,fill:'rgba(0,200,80,.12)',stroke:'#00cc44','stroke-width':1.5,'stroke-dasharray':'4 3'}));
    const gt=mk('text',{x:gx+pw/2,y:gy+ph/2,'text-anchor':'middle','dominant-baseline':'middle',fill:'#00cc44','font-size':11,'font-family':'monospace','font-weight':'bold'});
    gt.textContent=d.label;gh.appendChild(gt);svgEl.appendChild(gh);
  }
  renderTP();renderPalCounts();
}

function renderTP(){
  const tp=document.getElementById('tp'),p=state.puzzle;if(!p)return;
  const tests=runTests(p),allPass=tests.every(r=>r.allPass);
  const inN=p.inputs.map(i=>i.name),outN=p.outputs.map(o=>o.name);
  const rows=tests.map(tc=>{
    const cls=tc.allPass?'rp':'rf';
    const ic=inN.map(n=>`<td>${tc.inputs[n]}</td>`).join('');
    const oc=outN.map(n=>{const r=tc.results[n];return`<td class="${r?.pass?'vp':'vf'}">${r?.actual??'?'}</td>`;}).join('');
    return`<tr class="${cls}">${ic}<td class="sep">│</td>${oc}<td class="si">${tc.allPass?'✓':'✗'}</td></tr>`;
  }).join('');
  const th=`<tr>${inN.map(n=>`<th>${n}</th>`).join('')}<th></th>${outN.map(n=>`<th>${n}</th>`).join('')}<th></th></tr>`;
  tp.innerHTML=`<div class="ti"><div class="pt">LVL ${p.id}: ${p.name}</div><div class="pf">${p.flavor}</div>
    <div class="th">TRUTH TABLE</div>
    <table><thead>${th}</thead><tbody>${rows}</tbody></table>
    ${allPass?'<div class="pb">⚡ CIRCUIT COMPLETE</div>':''}
    </div>
    <div class="nav"><button onclick="prevP()" ${state.puzzleIdx===0?'disabled':''}>◀ PREV</button>
    <span>${state.puzzleIdx+1} / ${PUZZLES.length}</span>
    <button onclick="nextP()" ${allPass?'':'disabled'}>NEXT ▶</button></div>
    <div class="hint"><b>Place:</b> click palette → click grid<br><b>Wire:</b> output ○ → input ○<br>
    <b>Toggle IN:</b> click INPUT block<br><b>Delete:</b> right-click block or wire<br><b>ESC:</b> cancel</div>`;
}

function renderPal(){
  const p=state.puzzle,el=document.getElementById('pal');if(!p){el.innerHTML='';return;}
  const used={};for(const c of state.components)if(!c.fixed)used[c.type]=(used[c.type]||0)+1;
  let h='<div class="pal-hdr">COMPONENTS</div>';
  for(const[t,n]of Object.entries(p.available)){
    const rem=n-(used[t]||0),sel=placing===t;
    h+=`<div class="pi${sel?' sel':''}${rem===0?' dep':''}" onclick="selPlace('${t}')">
      <span class="pi-t">${DEFS[t]?.label||t}</span><span class="pi-c pc-${t}">${rem}/${n}</span></div>`;
  }
  el.innerHTML=h;
}
function renderPalCounts(){
  if(!state.puzzle)return;
  const used={};for(const c of state.components)if(!c.fixed)used[c.type]=(used[c.type]||0)+1;
  for(const[t,n]of Object.entries(state.puzzle.available)){
    const s=document.querySelector(`.pc-${t}`);if(!s)continue;
    const rem=n-(used[t]||0);s.textContent=`${rem}/${n}`;
    const item=s.closest('.pi');if(item){item.classList.toggle('dep',rem===0);item.classList.toggle('sel',placing===t);}
  }
}

function loadPuzzle(idx){
  state.puzzleIdx=idx;state.puzzle=PUZZLES[idx];state.components=[];state.wires=[];state.signals={};
  placing=wiringFrom=ghostPos=tempEnd=moving=null;svgEl.style.cursor='default';
  const p=state.puzzle;
  for(const i of p.inputs) state.components.push({id:nid++,type:'IN', gx:1,     gy:i.gy,name:i.name,value:0,fixed:true});
  for(const o of p.outputs)state.components.push({id:nid++,type:'OUT',gx:COLS-3,gy:o.gy,name:o.name,fixed:true});
  renderPal();render();
}
function nextP(){if(state.puzzleIdx<PUZZLES.length-1)loadPuzzle(state.puzzleIdx+1);}
function prevP(){if(state.puzzleIdx>0)loadPuzzle(state.puzzleIdx-1);}
function selPlace(t){
  const used=state.components.filter(c=>!c.fixed&&c.type===t).length;
  if(used>=(state.puzzle.available[t]||0))return;
  placing=placing===t?null:t;ghostPos=null;svgEl.style.cursor=placing?'crosshair':'default';renderPal();
}

// ── EVENTS ──
svgEl.addEventListener('mousemove',e=>{
  const pos=svgXY(e);
  if(placing){ghostPos=snap(pos.x,pos.y,placing);render();return;}
  if(wiringFrom){tempEnd=pos;render();return;}
  if(moving){
    const{comp,ox,oy}=moving,d=DEFS[comp.type];
    const gx=Math.max(2,Math.min(COLS-d.cw-2,Math.round(pos.x/CELL)-ox));
    const gy=Math.max(0,Math.min(ROWS-d.ch,  Math.round(pos.y/CELL)-oy));
    if(!occ(gx,gy,d.cw,d.ch,comp.id)){comp.gx=gx;comp.gy=gy;render();}
  }
});

svgEl.addEventListener('click',e=>{
  const pos=svgXY(e);
  if(placing){
    const{gx,gy}=snap(pos.x,pos.y,placing),d=DEFS[placing];
    if(!occ(gx,gy,d.cw,d.ch,null)){
      state.components.push({id:nid++,type:placing,gx,gy,value:0,fixed:false});
      if(state.components.filter(c=>!c.fixed&&c.type===placing).length>=(state.puzzle.available[placing]||0)){placing=null;svgEl.style.cursor='default';}
      render();renderPal();
    }return;
  }
  const poEl=e.target.closest('.po'),piEl=e.target.closest('.pi');
  if(piEl&&wiringFrom){
    const toC=parseInt(piEl.getAttribute('data-ci')),toP=parseInt(piEl.getAttribute('data-pi'));
    if(!state.wires.some(w=>w.to===toC&&w.tp===toP)&&wiringFrom.cid!==toC)
      state.wires.push({id:nid++,from:wiringFrom.cid,fp:wiringFrom.pi,to:toC,tp:toP});
    wiringFrom=null;tempEnd=null;render();return;
  }
  if(poEl){const cid=parseInt(poEl.getAttribute('data-ci')),pi=parseInt(poEl.getAttribute('data-pi'));wiringFrom={cid,pi};tempEnd=pos;render();return;}
  if(piEl){return;}
  const cbEl=e.target.closest('.cb');
  if(cbEl){
    const cg=cbEl.closest('.cg');if(cg){const c=state.components.find(x=>x.id===parseInt(cg.getAttribute('data-id')));if(c&&c.type==='IN'){c.value=c.value?0:1;render();return;}}
  }
  if(wiringFrom){wiringFrom=null;tempEnd=null;render();}
});

svgEl.addEventListener('mousedown',e=>{
  if(placing||wiringFrom||e.target.closest('.pin')||e.target.closest('.wire'))return;
  const cg=e.target.closest('.cg');
  if(cg&&e.button===0){
    const c=state.components.find(x=>x.id===parseInt(cg.getAttribute('data-id')));
    if(c&&!c.fixed){const pos=svgXY(e);moving={comp:c,ox:Math.round(pos.x/CELL)-c.gx,oy:Math.round(pos.y/CELL)-c.gy};e.preventDefault();}
  }
});
window.addEventListener('mouseup',()=>{if(moving){moving=null;render();}});

svgEl.addEventListener('contextmenu',e=>{
  e.preventDefault();
  const wEl=e.target.closest('.wire');
  if(wEl){state.wires=state.wires.filter(w=>w.id!==parseInt(wEl.getAttribute('data-wid')));render();return;}
  const cg=e.target.closest('.cg');
  if(cg){
    const id=parseInt(cg.getAttribute('data-id')),c=state.components.find(x=>x.id===id);
    if(c&&!c.fixed){state.components=state.components.filter(x=>x.id!==id);state.wires=state.wires.filter(w=>w.from!==id&&w.to!==id);render();renderPal();}
  }
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){placing=null;wiringFrom=null;tempEnd=null;ghostPos=null;svgEl.style.cursor='default';render();renderPal();}
});

loadPuzzle(0);
</script>
</body>
</html>
