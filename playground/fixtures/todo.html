<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo Fixture</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #12203a;
    --line: #223659;
    --text: #e7efff;
    --muted: #98a9c4;
    --accent: #5fc9ff;
    --done: #37d09f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(800px 300px at 20% -10%, #1a3b5e 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
  }
  .wrap { max-width: 520px; margin: 40px auto; padding: 20px; }
  .card {
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
    padding: 18px;
  }
  h1 { margin: 0 0 10px; font-size: 18px; color: var(--accent); }
  .row {
    display: flex; gap: 8px;
  }
  input, button {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 12px;
    background: #0d1729;
    color: var(--text);
    font-size: 14px;
  }
  input { flex: 1; }
  button {
    cursor: pointer;
    background: #1b2f52;
    border-color: #2b4a7d;
  }
  button:hover { background: #23406f; }
  ul { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
  li {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #0d1729;
  }
  li.done .text { color: var(--muted); text-decoration: line-through; }
  .text { flex: 1; font-size: 14px; }
  .btn-del {
    padding: 4px 8px; font-size: 12px;
    background: #301b27; border-color: #573144; color: #ffb6c6;
  }
  .counts { margin-top: 12px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Todo List</h1>
      <div class="row">
        <input id="new-todo" data-testid="todo-input" placeholder="What needs doing?">
        <button id="add" data-testid="todo-add">Add</button>
      </div>
      <ul id="list" data-testid="todo-list"></ul>
      <div class="counts"><span id="count">0</span> items &middot; <span id="done">0</span> done</div>
    </div>
  </div>

<script>
  const list = document.getElementById("list");
  const input = document.getElementById("new-todo");
  const countEl = document.getElementById("count");
  const doneEl = document.getElementById("done");

  function render() {
    const items = Array.from(list.children);
    countEl.textContent = items.length;
    doneEl.textContent = items.filter(li => li.classList.contains("done")).length;
  }

  function add() {
    const v = input.value.trim();
    if (!v) return;
    const li = document.createElement("li");
    li.setAttribute("data-testid", "todo-item");
    li.innerHTML = `
      <input type="checkbox" data-testid="todo-toggle" aria-label="Toggle">
      <span class="text"></span>
      <button class="btn-del" data-testid="todo-delete">Delete</button>
    `;
    li.querySelector(".text").textContent = v;
    li.querySelector('[data-testid="todo-toggle"]').addEventListener("change", (e) => {
      li.classList.toggle("done", e.target.checked);
      render();
    });
    li.querySelector('[data-testid="todo-delete"]').addEventListener("click", () => {
      li.remove();
      render();
    });
    list.appendChild(li);
    input.value = "";
    render();
  }

  document.getElementById("add").addEventListener("click", add);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
</script>
</body>
</html>
