//-------------------------------------------------------------
// Pixel-art helper: compile a string-pixel-grid into an offscreen canvas
// "." = transparent, other chars map via a per-sprite color table
//-------------------------------------------------------------
function makeSprite(rows, map){
  const h = rows.length, w = rows[0].length;
  const c = document.createElement("canvas");
  c.width=w; c.height=h;
  const x = c.getContext("2d");
  const img = x.createImageData(w,h);
  for(let y=0;y<h;y++){
    for(let i=0;i<w;i++){
      const ch = rows[y][i];
      const idx = (y*w+i)*4;
      if(ch==="." || !map[ch]){ img.data[idx+3]=0; continue; }
      const col = map[ch];
      const r=parseInt(col.slice(1,3),16), g=parseInt(col.slice(3,5),16), b=parseInt(col.slice(5,7),16);
      img.data[idx]=r; img.data[idx+1]=g; img.data[idx+2]=b; img.data[idx+3]=255;
    }
  }
  x.putImageData(img,0,0);
  return c;
}

//  - The whole room is surrounded by false-floor (*), which is solid when lens OFF and void when lens ON.
//  - Interior walls are curtain (C), solid when lens OFF, open when lens ON.
//  - Player must oscillate: lens OFF to cross void (false-floor is solid), lens ON to pass curtain walls.
//    This literally IS Curtain Theory: "consciousness oscillates between operator and self."
//  - Echo Ping (from Fragment 2) activates switch S, which... actually in this POC,
//    reaching F is the win. Keep it simple.

//-------------------------------------------------------------
// Input
//-------------------------------------------------------------
const keys = {};
const keyPressed = {};
addEventListener("keydown", e=>{
  const k = e.key.toLowerCase();
  if(!keys[k]) keyPressed[k] = true;
  keys[k] = true;
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
});
addEventListener("keyup", e=>{ keys[e.key.toLowerCase()] = false; });
function consumeKey(k){ const v = keyPressed[k]; keyPressed[k] = false; return v; }

//-------------------------------------------------------------
// Game state
//-------------------------------------------------------------
const game = {
  area: "overworld",
  player: { x: 6*TS, y: 3*TS, dir: "d", frame: 0, anim: 0, moving: false },
  lensOn: false,
  abilities: { curtainLens: true, frameShift: false, echoPing: false },
  fragments: { dig: false, lok: false, rift: false },
  pings: [],          // {x,y,r,life}
  patrols: [],        // {x,y,vx,vy,path,t}
  switches: {},       // id -> bool
  doorsOpen: {},      // areaKey -> bool
  phaseShiftActive: 0,
  dialog: null,       // {lines:[], i, done:false}
  textState: null,    // 'intro'
  flash: 0,
  won: false,
  tick: 0,
};

//-------------------------------------------------------------
// Dialog system
//-------------------------------------------------------------
function showDialog(text){
  game.dialog = { text: text, cursor: 0, done: false };
}
function tickDialog(){
  if(!game.dialog) return;
  if(game.tick % 1 === 0 && game.dialog.cursor < game.dialog.text.length){
    game.dialog.cursor += 2;
    if(game.dialog.cursor >= game.dialog.text.length){
      game.dialog.cursor = game.dialog.text.length;
      game.dialog.done = true;
    }
  }
  if(consumeKey("enter") || consumeKey(" ")){
    if(!game.dialog.done){
      game.dialog.cursor = game.dialog.text.length;
      game.dialog.done = true;
    } else {
      game.dialog = null;
    }
  }
}

//-------------------------------------------------------------
// Area loading
//-------------------------------------------------------------
function loadArea(key, spawn){
  game.area = key;
  const A = AREAS[key];
  // spawn
  if(spawn){
    game.player.x = spawn.x*TS; game.player.y = spawn.y*TS;
  } else {
    // find P or X
    const m = A.map;
    let found=false;
    for(let y=0;y<m.length && !found;y++){
      for(let x=0;x<m[y].length;x++){
        if(m[y][x]==="P"){ game.player.x=x*TS; game.player.y=y*TS; found=true; break; }
      }
    }
    if(!found){
      // default near X
      for(let y=0;y<m.length && !found;y++){
        for(let x=0;x<m[y].length;x++){
          if(m[y][x]==="X"){ game.player.x=x*TS; game.player.y=(y+1)*TS; found=true; break; }
        }
      }
    }
  }
  // patrols
  game.patrols = [];
  game.switches = {};
  const m = A.map;
  for(let y=0;y<m.length;y++){
    for(let x=0;x<m[y].length;x++){
      const c = m[y][x];
      if(c==="E"){
        game.patrols.push({
          ox:x*TS, oy:y*TS,
          x:x*TS, y:y*TS,
          dir:1, axis:"x",
          range: 3*TS,
          t: Math.random()*100,
          alert:0,
        });
      } else if(c==="S"){
        game.switches[x+","+y] = false;
      }
    }
  }
  if(A.intro && key!=="overworld"){
    showDialog(A.intro);
  }
  game.flash = 10;
}

//-------------------------------------------------------------
// Collision & tile queries
//-------------------------------------------------------------
function tileAt(ax, ay){
  const A = AREAS[game.area];
  const m = A.map;
  const tx = Math.floor(ax/TS), ty = Math.floor(ay/TS);
  if(ty<0||ty>=m.length||tx<0||tx>=m[0].length) return "#";
  return m[ty][tx];
}
function isSolid(ch){
  if(ch==="#") return true;
  if(ch==="~") return game.phaseShiftActive<=0;
  if(ch==="C") return !game.lensOn;           // curtain: solid when lens off
  if(ch==="*") return game.lensOn;            // false-floor: void when lens on
  if(ch==="D"){
    return !game.doorsOpen[game.area];
  }
  return false;
}
function canStand(px, py){
  // character hitbox 10x10 at center-bottom of sprite
  const boxes = [
    [px+3, py+6],
    [px+12, py+6],
    [px+3, py+14],
    [px+12, py+14],
  ];
  for(const [x,y] of boxes){
    if(isSolid(tileAt(x,y))) return false;
  }
  return true;
}

//-------------------------------------------------------------
// Interaction: step on tile triggers
//-------------------------------------------------------------
function onPlayerTile(){
  const p = game.player;
  const cx = Math.floor((p.x+8)/TS), cy = Math.floor((p.y+12)/TS);
  const A = AREAS[game.area];
  const ch = A.map[cy] ? A.map[cy][cx] : " ";
  // gates
  if(game.area==="overworld"){
    if(ch==="G"){ loadArea("dig"); return; }
    if(ch==="L"){ loadArea("lok"); return; }
    if(ch==="R"){ loadArea("rift"); return; }
  } else {
    if(ch==="X"){
      loadArea("overworld", {x: p._returnX||6, y: p._returnY||4});
      return;
    }
  }
  // fragment pickup
  if(ch==="F"){
    const areaKey = game.area;
    if(!game.fragments[areaKey]){
      game.fragments[areaKey] = true;
      const unlock = A.fragmentUnlocks;
      if(unlock) game.abilities[unlock] = true;
      // replace F with floor in map (persist via mutation)
      replaceTile(cx, cy, " ");
      showDialog(A.fragmentText);
      // check win
      if(game.fragments.dig && game.fragments.lok && game.fragments.rift){
        setTimeout(()=>{ game.won = true; }, 100);
      }
    }
  }
  // switch
  if(ch==="S"){
    const key = cx+","+cy;
    if(!game.switches[key]){
      game.switches[key] = true;
      game.doorsOpen[game.area] = true;
    }
  }
}
function replaceTile(x,y,ch){
  const A = AREAS[game.area];
  const row = A.map[y];
  A.map[y] = row.substring(0,x)+ch+row.substring(x+1);
}

//-------------------------------------------------------------
// Player update
//-------------------------------------------------------------
function updatePlayer(){
  if(game.dialog || game.won) return;
  const p = game.player;
  const sp = 1.2;
  let dx=0, dy=0;
  if(keys["arrowleft"]||keys["a"]) { dx=-sp; p.dir="l"; }
  else if(keys["arrowright"]||keys["d"]) { dx=sp; p.dir="r"; }
  else if(keys["arrowup"]||keys["w"]) { dy=-sp; p.dir="u"; }
  else if(keys["arrowdown"]||keys["s"]) { dy=sp; p.dir="d"; }

  // lens toggle (hold)
  game.lensOn = !!keys["shift"];

  // frame shift
  if(consumeKey("z") && game.abilities.frameShift){
    game.phaseShiftActive = 45; // ~0.75s
  }
  if(game.phaseShiftActive>0) game.phaseShiftActive--;

  // echo ping
  if(consumeKey("x") && game.abilities.echoPing){
    game.pings.push({ x:p.x+8, y:p.y+12, r:0, life:40 });
    // trigger any switch within 4 tiles
    const A = AREAS[game.area];
    for(let y=0;y<A.map.length;y++){
      for(let xi=0;xi<A.map[y].length;xi++){
        if(A.map[y][xi]==="S"){
          const dx=(xi*TS+8)-(p.x+8), dy=(y*TS+8)-(p.y+12);
          if(dx*dx+dy*dy < (4*TS)*(4*TS)){
            const key = xi+","+y;
            if(!game.switches[key]){
              game.switches[key] = true;
              game.doorsOpen[game.area] = true;
            }
          }
        }
      }
    }
  }
  // reset area
  if(consumeKey("r")){
    loadArea(game.area);
    return;
  }

  // move with per-axis collision
  if(dx){
    const nx = p.x + dx;
    if(canStand(nx, p.y)) p.x = nx;
  }
  if(dy){
    const ny = p.y + dy;
    if(canStand(p.x, ny)) p.y = ny;
  }

  p.moving = (dx!==0 || dy!==0);
  if(p.moving) p.anim++;
  p.frame = Math.floor(p.anim/10)%2;

  onPlayerTile();
}

//-------------------------------------------------------------
// Patrols
//-------------------------------------------------------------
function updatePatrols(){
  if(game.dialog || game.won) return;
  const p = game.player;
  for(const pa of game.patrols){
    pa.t++;
    // simple horizontal patrol
    pa.x += pa.dir * 0.5;
    if(pa.x > pa.ox + pa.range) pa.dir = -1;
    if(pa.x < pa.ox - pa.range) pa.dir = 1;
    // detection
    const dx = (p.x+8)-(pa.x+8), dy = (p.y+8)-(pa.y+8);
    const dist2 = dx*dx+dy*dy;
    if(dist2 < (3*TS)*(3*TS)){
      pa.alert = Math.min(60, pa.alert+2);
      if(pa.alert>=60){
        // spotted — reset player to entry
        game.flash = 20;
        loadArea(game.area);
        return;
      }
    } else {
      pa.alert = Math.max(0, pa.alert-1);
    }
  }
  // ping lifetime
  for(const p of game.pings){ p.r += 2; p.life--; }
  game.pings = game.pings.filter(p=>p.life>0);
}

//-------------------------------------------------------------
// Rendering
//-------------------------------------------------------------
function drawTile(ch, x, y){
  const A = AREAS[game.area];
  // background floor first
  ctx.drawImage(A.floor, x, y);
  switch(ch){
    case "#": ctx.drawImage(T_WALL, x, y); break;
    case "~":
      if(game.phaseShiftActive<=0) ctx.drawImage(T_PHASE, x, y);
      else { /* passable: shimmer only */
        ctx.globalAlpha = 0.3; ctx.drawImage(T_PHASE, x, y); ctx.globalAlpha = 1;
      }
      break;
    case "C":
      if(game.lensOn) ctx.drawImage(T_CURTAIN_REVEALED, x, y);
      else ctx.drawImage(T_CURTAIN_HIDDEN, x, y);
      break;
    case "*":
      if(game.lensOn) ctx.drawImage(T_FALSE_FLOOR_REVEALED, x, y);
      // else looks like normal floor (already drawn)
      break;
    case "G": ctx.drawImage(T_GATE_DIG, x, y); break;
    case "L": ctx.drawImage(T_GATE_LOK, x, y); break;
    case "R": ctx.drawImage(T_GATE_RIFT, x, y); break;
    case "X": ctx.drawImage(T_GATE_EXIT, x, y); break;
    case "F": ctx.drawImage(T_FRAGMENT, x, y); break;
    case "S": {
      const key = Math.floor(x/TS)+","+Math.floor(y/TS);
      ctx.drawImage(game.switches[key] ? T_SWITCH_ON : T_SWITCH_OFF, x, y);
      break;
    }
    case "D":
      if(!game.doorsOpen[game.area]) ctx.drawImage(T_DOOR, x, y);
      break;
    case "H":
      // Mentor NPC — draw with different color
      ctx.fillStyle = PAL[8];
      ctx.fillRect(x+4, y+2, 8, 10);
      ctx.fillStyle = PAL[14];
      ctx.fillRect(x+5, y+3, 6, 3);
      ctx.fillStyle = PAL[2];
      ctx.fillRect(x+4, y+12, 8, 4);
      break;
    case "=": break;
    case "E": break; // drawn separately
    case "P": break;
  }
}

function drawMap(){
  const A = AREAS[game.area];
  for(let y=0;y<A.map.length;y++){
    for(let x=0;x<A.map[y].length;x++){
      drawTile(A.map[y][x], x*TS, y*TS);
    }
  }
}

function drawPatrols(){
  for(const pa of game.patrols){
    ctx.drawImage(T_PATROL, Math.round(pa.x), Math.round(pa.y));
    // alert indicator
    if(pa.alert>0){
      ctx.fillStyle = pa.alert>40 ? PAL[7] : PAL[8];
      ctx.fillRect(Math.round(pa.x)+6, Math.round(pa.y)-4, 4, 4);
    }
    // detection cone (faint) visible under echo ping
    // handled by ping overlay
  }
}

function drawPlayer(){
  const p = game.player;
  const key = p.dir + (p.moving ? p.frame : 0);
  const spr = PLAYER_SPRITES[key] || PLAYER_SPRITES[p.dir+"0"];
  ctx.drawImage(spr, Math.round(p.x), Math.round(p.y));
  // lens glow
  if(game.lensOn){
    ctx.strokeStyle = PAL[7];
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(p.x+8, p.y+8, 6 + Math.sin(game.tick*0.3), 0, Math.PI*2);
    ctx.stroke();
  }
  // frame shift glow
  if(game.phaseShiftActive>0){
    ctx.strokeStyle = PAL[6];
    ctx.lineWidth = 1;
    ctx.strokeRect(p.x-1, p.y-1, 18, 18);
  }
}

function drawPings(){
  for(const pg of game.pings){
    ctx.strokeStyle = PAL[7];
    ctx.globalAlpha = pg.life/40;
    ctx.beginPath();
    ctx.arc(pg.x, pg.y, pg.r, 0, Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // when ping active, reveal patrols through walls (already drawn on top)
}

//-------------------------------------------------------------
// HUD
//-------------------------------------------------------------
function drawHUD(){
  // top bar
  ctx.fillStyle = PAL[1];
  ctx.fillRect(0, 0, W, 10);
  ctx.fillStyle = PAL[7];
  ctx.font = "6px monospace";
  // area name
  ctx.fillStyle = PAL[10];
  drawText(AREAS[game.area].name.toUpperCase(), 3, 7, PAL[7]);
  // fragments
  const fcount = (game.fragments.dig?1:0)+(game.fragments.lok?1:0)+(game.fragments.rift?1:0);
  drawText("FRAG "+fcount+"/3", W-40, 7, PAL[9]);

  // ability icons bottom-left
  const icons = [
    { on: game.abilities.curtainLens, label:"L", active: game.lensOn, color: PAL[7] },
    { on: game.abilities.frameShift,  label:"Z", active: game.phaseShiftActive>0, color: PAL[6] },
    { on: game.abilities.echoPing,    label:"X", active: false, color: PAL[8] },
  ];
  for(let i=0;i<icons.length;i++){
    const x = 3 + i*14, y = H-11;
    ctx.fillStyle = icons[i].on ? PAL[3] : PAL[2];
    ctx.fillRect(x, y, 10, 8);
    ctx.strokeStyle = icons[i].active ? icons[i].color : (icons[i].on ? PAL[11] : PAL[12]);
    ctx.strokeRect(x+0.5, y+0.5, 9, 7);
    drawText(icons[i].label, x+3, y+6, icons[i].on ? icons[i].color : PAL[12]);
  }
}

function drawText(str, x, y, color){
  color = color || PAL[10];
  ctx.fillStyle = color;
  let cx = x, cy = y-6;
  for(const ch of str.toUpperCase()){
    if(ch==="\n"){ cy += 9; cx = x; continue; }
    const g = FONT[ch] || FONT[" "];
    if(!g) continue;
    for(let yy=0;yy<7;yy++){
      const row = g[yy];
      for(let xx=0;xx<5;xx++){
        if(row[xx]==="1") ctx.fillRect(cx+xx, cy+yy, 1, 1);
      }
    }
    cx += 6;
  }
}
function wrapText(str, maxChars){
  const out=[];
  for(const para of str.split("\n")){
    const words = para.split(" ");
    let line="";
    for(const w of words){
      if((line+" "+w).trim().length > maxChars){ out.push(line); line=w; }
      else line = line ? line+" "+w : w;
    }
    if(line) out.push(line);
    if(para==="") out.push("");
  }
  return out;
}

//-------------------------------------------------------------
// Dialog render
//-------------------------------------------------------------
function drawDialog(){
  if(!game.dialog) return;
  const bx=8, by=H-72, bw=W-16, bh=60;
  ctx.fillStyle = PAL[1];
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = PAL[7];
  ctx.strokeRect(bx+0.5, by+0.5, bw-1, bh-1);
  ctx.strokeStyle = PAL[6];
  ctx.strokeRect(bx+2.5, by+2.5, bw-5, bh-5);

  const shown = game.dialog.text.substring(0, game.dialog.cursor);
  const lines = wrapText(shown, 38);
  let yy = by+10;
  for(let i=0;i<Math.min(lines.length,5);i++){
    drawText(lines[i], bx+6, yy, PAL[10]);
    yy += 9;
  }
  if(game.dialog.done){
    if((game.tick>>3)&1) drawText("...", bw-6, by+bh-6, PAL[7]);
  }
}

  drawText("THE TRIPTYCH RESONATES", 32, 60, PAL[7]);
  drawText("THREE BRIDGES", 78, 78, PAL[9]);
  drawText("ONE TO CROSS.", 60, 100, PAL[10]);
  drawText("ONE TO LOSE.",  60, 112, PAL[10]);
  drawText("ONE TO FIND YOUR WAY HOME.", 30, 124, PAL[10]);
  drawText("- END OF PROOF OF CONCEPT -", 30, 160, PAL[8]);
  drawText("PRESS R TO REPLAY", 60, 180, PAL[11]);
  if(consumeKey("r")){
    // reset
    game.fragments = {dig:false,lok:false,rift:false};
    game.abilities = {curtainLens:true, frameShift:false, echoPing:false};
    game.doorsOpen = {};
    // rebuild maps (restore F tiles)
    AREAS.dig.map  = MAP_DIG_SRC.slice();
    AREAS.lok.map  = MAP_LOK_SRC.slice();
    AREAS.rift.map = MAP_RIFT_SRC.slice();
    game.won = false;
    loadArea("overworld");
  }
}

// snapshot original maps so we can reset after pickup
const MAP_DIG_SRC  = MAP_DIG.slice();
const MAP_LOK_SRC  = MAP_LOK.slice();
const MAP_RIFT_SRC = MAP_RIFT.slice();

//-------------------------------------------------------------
// Main loop
//-------------------------------------------------------------
function frame(){
  game.tick++;

  // update
  tickDialog();
  if(!game.dialog && !game.won){
    updatePlayer();
    updatePatrols();
  }

  // render
  ctx.fillStyle = PAL[2];
  ctx.fillRect(0,0,W,H);

  drawMap();
  drawPatrols();
  drawPlayer();
  drawPings();

  // lens vignette overlay when active
  if(game.lensOn){
    ctx.fillStyle = "rgba(0,240,255,0.04)";
    ctx.fillRect(0,0,W,H);
    // scanlines
    ctx.fillStyle = "rgba(0,240,255,0.06)";
    for(let y=0;y<H;y+=2) ctx.fillRect(0,y,W,1);
  }

  drawHUD();
  drawDialog();

  // flash on area change
  if(game.flash>0){
    ctx.fillStyle = "rgba(255,255,255,"+(game.flash/20)+")";
    ctx.fillRect(0,0,W,H);
    game.flash--;
  }

  if(game.won) drawWin();

  requestAnimationFrame(frame);
}

//-------------------------------------------------------------
// Boot
//-------------------------------------------------------------
loadArea("overworld");
showDialog("THE TRIPTYCH OF PASSAGE\n\nYou are Archivist-7, a Bridge Hunter. Three Fragments have surfaced. Bring them back.\n\nHold SHIFT to perceive the hidden layer.");
requestAnimationFrame(frame);

</script>
